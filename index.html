<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horizon Industrial Parks: value tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --side:#1D2340; --side-2:#2E3763; --side-ink:#ECEEF6; --side-mute:#A3A8C6;
  --accent:#24356B; --accent-soft:#E9EDF7; --accent-ink:#24356B;
  --sky:#EAF2FB; --sky-2:#A9D0F6;
  --g1:#F2741D; --g2:#2DB04A; --orange:#F2741D; --tot:#1D2340;
  --bg:#F6F7F9; --card:#FFFFFF; --ink:#16181D; --mute:#5F6370; --line:#DFE2E8; --line-2:#ECEEF2;
  --bad:#C8372D; --bad-soft:#FBE7E4; --good:#1C8C3C; --good-soft:#E1F4E5; --flat:#9895AE; --flat-soft:#EEEFF5;
  --amber:#B97A12; --amber-soft:#FAF0DC; --grey-card:#F4F6FB; --signal:#01C964;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --side:#12162B; --side-2:#252C52; --side-ink:#ECEEF6; --side-mute:#9DA2C2;
  --accent:#9DB2F0; --accent-soft:#232B4C; --accent-ink:#B9C8F5; --sky:#1A2236; --sky-2:#2B3B66;
  --g1:#F58A3E; --g2:#4CC56A; --orange:#F58A3E; --tot:#8E98CC;
  --bg:#0E1018; --card:#171A25; --ink:#ECEDF2; --mute:#A2A6B5; --line:#2A2E3E; --line-2:#222533;
  --bad:#F1857A; --bad-soft:#3A1E24; --good:#4FD196; --good-soft:#15342A; --flat:#8C89A6; --flat-soft:#24213F;
  --amber:#E6B04E; --amber-soft:#3A3020; --grey-card:#1D1A37; color-scheme: dark; } }
:root[data-theme="dark"]{
  --side:#12162B; --side-2:#252C52; --side-ink:#ECEEF6; --side-mute:#9DA2C2;
  --accent:#9DB2F0; --accent-soft:#232B4C; --accent-ink:#B9C8F5; --sky:#1A2236; --sky-2:#2B3B66;
  --g1:#F58A3E; --g2:#4CC56A; --orange:#F58A3E; --tot:#8E98CC;
  --bg:#0E1018; --card:#171A25; --ink:#ECEDF2; --mute:#A2A6B5; --line:#2A2E3E; --line-2:#222533;
  --bad:#F1857A; --bad-soft:#3A1E24; --good:#4FD196; --good-soft:#15342A; --flat:#8C89A6; --flat-soft:#24213F;
  --amber:#E6B04E; --amber-soft:#3A3020; --grey-card:#1D1A37; color-scheme: dark; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"Plus Jakarta Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
button{ font:inherit; color:inherit; cursor:pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.grad{ background:linear-gradient(90deg,var(--g1),var(--g2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.app{ display:grid; grid-template-columns:236px 1fr; min-height:100%; }
/* sidebar */
.side{ background:var(--side); color:var(--side-ink); display:flex; flex-direction:column; padding:22px 14px 18px; position:sticky; top:0; height:100vh; height:100dvh; }
.brand{ padding:2px 8px 26px; }
.brand .wm{ font-weight:800; font-size:19px; letter-spacing:.14em; }
.brand .rule{ height:3px; width:58px; border-radius:2px; background:linear-gradient(90deg,var(--g1),var(--g2)); margin:7px 0 8px; }
.brand span{ color:var(--side-mute); font-size:12.5px; display:block; }
.nav{ display:flex; flex-direction:column; gap:2px; }
.nav button{ display:flex; align-items:center; gap:13px; background:none; border:0; color:var(--side-mute); padding:10px 12px; border-radius:8px; text-align:left; font-size:14.5px; font-weight:500; }
.nav button:hover{ color:var(--side-ink); }
.nav button.on{ background:var(--side-2); color:#fff; font-weight:600; }
.nav svg{ width:19px; height:19px; flex:none; stroke:currentColor; fill:none; stroke-width:1.7; }
.badge{ margin-left:auto; background:var(--orange); color:#fff; border-radius:999px; font-size:11.5px; min-width:21px; height:21px; display:grid; place-items:center; font-weight:700; }
.side-foot{ margin-top:auto; color:var(--side-mute); font-size:12px; padding:8px; line-height:1.5; }
.side-foot b{ color:var(--side-ink); font-weight:600; display:block; margin-bottom:2px; }
.side-foot button{ background:none; border:0; color:var(--side-ink); padding:10px 0 0; font-weight:600; font-size:12.5px; text-decoration:underline; text-underline-offset:3px; }
/* top */
.main{ min-width:0; display:flex; flex-direction:column; }
.top{ background:var(--card); border-bottom:1px solid var(--line); padding:14px 28px; position:sticky; top:env(safe-area-inset-top,0px); z-index:20; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--card); }
.co{ display:flex; flex-direction:column; margin-right:6px; }
.co h1{ font-size:17px; margin:0; font-weight:700; letter-spacing:-.01em; white-space:nowrap; }
.co span{ font-size:12px; color:var(--mute); }
.filters{ display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
.sel{ position:relative; display:flex; align-items:center; border:1px solid var(--line); border-radius:8px; background:var(--card); padding:0 8px 0 11px; height:38px; gap:5px; }
.sel label{ color:var(--mute); font-size:13px; white-space:nowrap; }
.sel select{ appearance:none; border:0; background:transparent; font:inherit; font-size:13.5px; font-weight:600; color:var(--ink); padding:0 20px 0 2px; height:36px; cursor:pointer; max-width:150px; field-sizing:content; }
.sel::after{ content:""; position:absolute; right:11px; top:15px; width:6px; height:6px; border-right:1.6px solid var(--mute); border-bottom:1.6px solid var(--mute); transform:rotate(45deg); pointer-events:none; }
.sel select option{ color:#1C1838; }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:8px; padding:3px; align-items:center; height:38px; background:var(--grey-card); }
.seg span{ color:var(--mute); padding:0 6px 0 6px; font-size:12.5px; }
.seg button{ border:0; background:none; padding:5px 11px; border-radius:6px; font-size:13.5px; color:var(--mute); }
.seg button.on{ background:var(--card); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(28,24,56,.12); }
.page{ padding:26px 30px 70px; max-width:1640px; }
/* headline */
.headline{ margin:0 0 18px; font-size:25px; line-height:1.3; font-weight:700; letter-spacing:-.015em; max-width:1000px; }
.dek{ color:var(--mute); font-size:15px; margin:0 0 22px; max-width:900px; }
.lens-note{ margin:0 0 18px; color:var(--ink); font-size:13.5px; background:var(--sky); border-radius:8px; padding:10px 14px; max-width:1100px; }
.lens-note button{ margin-left:8px; border:1px solid var(--accent); color:var(--accent-ink); background:transparent; border-radius:6px; padding:2px 10px; font-size:12.5px; font-weight:600; }
/* stat band (annual report style: number, caption, vertical rule) */
.stats{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 6px; margin-bottom:22px; }
.stat{ border-left:1.5px solid var(--line); padding:2px 16px 0; text-align:left; background:none; border-top:0; border-right:0; border-bottom:0; position:relative; min-width:0; }
.stat:first-child{ border-left:0; }
.stat:hover .sv{ color:var(--accent-ink); }
.stat .sl{ color:var(--mute); font-size:13px; font-weight:500; }
.stat .sv{ font-size:26px; font-weight:700; letter-spacing:-.02em; margin:2px 0 0; }
.stat .sv small{ font-size:13px; color:var(--mute); font-weight:500; margin-left:3px; }
.stat .sc{ font-size:12.5px; color:var(--mute); }
.stat .sd{ font-size:12.5px; font-weight:600; }
.stat.na .sv{ color:var(--flat); font-size:14px; font-weight:500; margin-top:8px; }
.stat svg{ position:absolute; right:14px; top:4px; width:58px; height:22px; }
.bad-t{ color:var(--bad); } .good-t{ color:var(--good); } .flat-t{ color:var(--mute); }
/* tabs */
.tabrow{ display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:12px; justify-content:space-between; }
.tabs{ display:flex; gap:26px; border-bottom:1px solid var(--line); }
.tabs button{ border:0; background:none; padding:8px 0 10px; font-size:15px; color:var(--mute); border-bottom:2.5px solid transparent; margin-bottom:-1px; }
.tabs button.on{ color:var(--ink); font-weight:700; border-color:var(--orange); }
.legend{ display:flex; gap:14px; color:var(--mute); font-size:12.5px; flex-wrap:wrap; align-items:center; }
.legend i{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:0; }
.legend .how{ border:0; background:none; color:var(--accent-ink); font-weight:600; text-decoration:underline; text-underline-offset:3px; padding:0; font-size:12.5px; }
/* tree panels */
.panels{ display:grid; gap:18px; }
.panel{ background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; position:relative; }
.panel-h{ display:flex; align-items:baseline; gap:12px; padding:16px 22px 4px; flex-wrap:wrap; }
.panel-h h2{ font-size:17px; margin:0; font-weight:700; }
.panel-h .sub{ color:var(--mute); font-size:13.5px; }
.btn{ border:1px solid var(--line); background:var(--card); border-radius:8px; padding:7px 13px; font-size:13.5px; font-weight:500; }
.btn:hover{ border-color:var(--accent); }
.btn.pri{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
.tree-wrap{ position:relative; overflow:auto; padding:14px 22px 70px; }
.tree-inner{ position:relative; transform-origin:0 0; }
.tree-svg{ position:absolute; inset:0; overflow:visible; pointer-events:none; }
.col-label{ position:absolute; font-size:12.5px; color:var(--mute); font-weight:600; }
.node{ position:absolute; width:196px; height:94px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:9px 12px 8px 15px; cursor:pointer; text-align:left; overflow:hidden; }
.node::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--flat); }
.node.bad::before{ background:var(--bad); } .node.good::before{ background:var(--good); }
.node:hover{ border-color:var(--accent); box-shadow:0 2px 10px rgba(29,35,64,.10); }
.node.sel{ box-shadow:0 0 0 2px var(--accent); }
.node.ref{ border-style:dashed; background:var(--grey-card); }
.node .n{ font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:16px; }
.node .val{ font-size:21px; font-weight:700; letter-spacing:-.015em; margin-top:1px; }
.node .val small{ font-size:11.5px; color:var(--mute); font-weight:500; margin-left:3px; }
.node .ft{ display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--mute); margin-top:3px; gap:4px; white-space:nowrap; }
.node .ft span:first-child{ overflow:hidden; text-overflow:ellipsis; }
.dchip{ border-radius:4px; padding:1px 6px; font-weight:600; font-size:11.5px; white-space:nowrap; }
.dchip.bad{ background:var(--bad-soft); color:var(--bad); } .dchip.good{ background:var(--good-soft); color:var(--good); } .dchip.flat{ background:var(--flat-soft); color:var(--mute); }
.node.off{ background:repeating-linear-gradient(135deg,var(--grey-card) 0 7px, var(--card) 7px 14px); cursor:default; }
.node.off::before{ background:var(--line); }
.node.off .val{ font-size:12px; color:var(--mute); font-weight:500; margin-top:8px; line-height:1.35; }
.node .ext{ position:absolute; right:8px; top:8px; width:16px; height:16px; color:var(--accent); }
.op{ position:absolute; width:20px; height:20px; border-radius:50%; background:var(--card); border:1px solid var(--line); display:grid; place-items:center; font-size:12.5px; color:var(--mute); font-weight:700; line-height:1; }
.tog{ position:absolute; height:22px; min-width:22px; padding:0 6px; border-radius:11px; background:var(--card); border:1px solid var(--line); font-size:11.5px; font-weight:700; color:var(--accent-ink); display:grid; place-items:center; }
.tog:hover{ border-color:var(--accent); }
.edge-note{ position:absolute; font-size:11.5px; color:var(--mute); }
.panel-h .fs{ margin-left:auto; }
.panel.full{ position:fixed; inset:0; z-index:45; border-radius:0; border:0; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); }
.panel.full .tree-wrap{ flex:1; overflow:auto; }
.zoom{ position:absolute; right:16px; bottom:14px; display:flex; align-items:center; gap:2px; background:var(--card); border:1px solid var(--line); border-radius:9px; padding:3px; z-index:2; }
.zoom button{ border:0; background:none; padding:6px 10px; border-radius:6px; font-size:13px; }
.zoom button:hover{ background:var(--grey-card); }
.zoom span{ color:var(--mute); font-size:12.5px; min-width:42px; text-align:center; }
.zoom i{ width:1px; height:18px; background:var(--line); margin:0 3px; }
/* lower */
.lower{ display:grid; grid-template-columns:1.25fr 1fr; gap:18px; margin-top:18px; }
.box{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 22px; }
.box h3{ margin:0; font-size:17px; font-weight:700; }
.box .sub{ color:var(--mute); font-size:13.5px; margin:3px 0 14px; }
.box-h{ display:flex; align-items:flex-start; gap:12px; justify-content:space-between; flex-wrap:wrap; }
.bridge-row{ display:grid; grid-template-columns:minmax(170px,250px) 1fr 64px; align-items:center; gap:12px; padding:5px 0; }
.bridge-row .lbl{ font-size:14px; display:flex; gap:6px; align-items:center; }
.bridge-row .lbl button{ border:0; background:none; padding:0; width:18px; color:var(--accent-ink); font-weight:700; }
.bridge-row.tot .lbl{ font-weight:700; }
.bar-track{ position:relative; height:18px; }
.bar{ position:absolute; top:0; height:18px; border-radius:3px; }
.bar.tot{ background:var(--tot); } .bar.neg{ background:var(--bad); } .bar.pos{ background:var(--good); }
.bridge-row .num{ text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
.sub-rows{ padding:2px 0 8px 26px; border-left:2px solid var(--line-2); margin-left:8px; }
.sub-rows div{ display:flex; justify-content:space-between; font-size:13px; color:var(--mute); padding:2px 0; }
.check{ border-top:1px solid var(--line); margin-top:12px; padding-top:12px; color:var(--mute); font-size:13px; }
.plain{ font-size:14.5px; margin:0 0 14px; }
.alert-li{ display:grid; grid-template-columns:12px 1fr auto; gap:10px; padding:12px 0; border-bottom:1px solid var(--line-2); cursor:pointer; }
.alert-li:last-child{ border-bottom:0; }
.dot{ width:9px; height:9px; border-radius:50%; margin-top:7px; background:var(--bad); }
.dot.amber{ background:var(--amber); } .dot.grey{ background:var(--flat); }
.alert-li .tt{ font-weight:600; font-size:14px; }
.tags{ display:flex; gap:8px; margin-top:5px; flex-wrap:wrap; align-items:center; font-size:12.5px; color:var(--mute); }
.tag{ border-radius:5px; padding:1px 8px; font-size:12px; font-weight:600; background:var(--grey-card); color:var(--ink); }
.tag.open{ background:var(--bad-soft); color:var(--bad); } .tag.ack{ background:var(--amber-soft); color:var(--amber); } .tag.closed{ background:var(--good-soft); color:var(--good); } .tag.rev{ background:var(--accent-soft); color:var(--accent-ink); }
.imp{ text-align:right; white-space:nowrap; } .imp b{ display:block; font-size:15px; } .imp span{ color:var(--mute); font-size:12px; }
/* drawer */
.drawer{ position:fixed; top:0; right:0; bottom:0; width:min(500px,100%); background:var(--card); border-left:1px solid var(--line); z-index:50; transform:translateX(102%); transition:transform .22s ease; display:flex; flex-direction:column; box-shadow:-12px 0 40px rgba(28,24,56,.14); }
.drawer.open{ transform:none; }
.drawer-h{ padding:calc(20px + env(safe-area-inset-top,0px)) 24px 14px; border-bottom:1px solid var(--line-2); display:flex; gap:10px; align-items:flex-start; }
.drawer-h h3{ margin:0; font-size:20px; }
.drawer-h .x{ margin-left:auto; border:0; background:var(--grey-card); width:32px; height:32px; border-radius:8px; font-size:18px; flex:none; }
.drawer-b{ overflow:auto; padding:18px 24px calc(30px + env(safe-area-inset-bottom,0px)); }
.bigv{ font-size:34px; font-weight:700; letter-spacing:-.02em; }
.h4{ font-weight:700; font-size:14px; margin:22px 0 6px; }
.read{ background:var(--sky); color:var(--ink); border-radius:8px; padding:12px 14px; font-size:14px; }
.read b{ color:var(--accent-ink); }
.para{ margin:0 0 6px; font-size:14px; }
.askq{ border-left:3px solid var(--orange); padding:4px 0 4px 12px; font-size:14px; color:var(--ink); }
.dl{ display:grid; grid-template-columns:100px 1fr; gap:5px 12px; font-size:13px; margin:10px 0 0; color:var(--mute); }
.dl dt{ color:var(--mute); } .dl dd{ margin:0; color:var(--ink); }
table.t{ width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums; }
table.t th{ text-align:right; color:var(--mute); font-weight:500; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
table.t th:first-child, table.t td:first-child{ text-align:left; }
table.t td{ text-align:right; padding:8px; border-bottom:1px solid var(--line-2); }
table.t tr.click{ cursor:pointer; } table.t tr.click:hover td{ background:var(--grey-card); }
table.t tr.total td{ font-weight:700; border-top:1px solid var(--line); }
.tw{ overflow-x:auto; }
.splits{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.splits button{ border:1px solid var(--line); background:var(--card); border-radius:6px; padding:4px 11px; font-size:12.5px; }
.splits button.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
.scrim{ position:fixed; inset:0; background:rgba(20,16,44,.3); z-index:40; display:none; }
.scrim.on{ display:block; }
/* page headings */
.ph{ margin:0 0 20px; } .ph h2{ font-size:27px; margin:0 0 6px; font-weight:700; letter-spacing:-.02em; } .ph p{ color:var(--mute); margin:0; max-width:760px; font-size:15px; }
/* overview */
.hero{ background:var(--card); border:1px solid var(--line); border-top:4px solid var(--orange); border-radius:14px; padding:28px 30px 26px; margin-bottom:22px; position:relative; overflow:hidden; }
.hero .when{ font-size:13.5px; color:var(--mute); font-weight:600; margin-bottom:6px; }
.hero h2{ font-size:30px; line-height:1.25; margin:0 0 10px; font-weight:700; letter-spacing:-.02em; max-width:880px; }
.hero p{ font-size:16px; margin:0; max-width:820px; }
.hero-stats{ display:flex; gap:0; margin-top:22px; flex-wrap:wrap; }
.hero-stats div{ border-left:2px solid var(--orange); padding:0 26px 0 14px; margin-bottom:8px; }
.hero-stats b{ display:block; font-size:28px; font-weight:700; letter-spacing:-.02em; }
.hero-stats span{ font-size:13px; color:var(--ink); }
.ov-sec{ display:grid; grid-template-columns:280px 1fr; gap:28px; padding:26px 0; border-top:1px solid var(--line); }
.ov-sec h3{ font-size:19px; margin:0 0 6px; line-height:1.3; }
.ov-sec .side-note{ color:var(--mute); font-size:13.5px; }
.walk{ display:grid; grid-template-columns:200px 1fr 92px; gap:6px 14px; align-items:center; font-size:14px; }
.walk .wl{ } .walk .wl small{ display:block; color:var(--mute); font-size:12px; }
.walk .wb{ position:relative; height:24px; }
.walk .wb div{ position:absolute; top:3px; height:18px; border-radius:3px; }
.walk .wv{ text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
.walk .tot .wl{ font-weight:700; }
.eq{ display:flex; flex-wrap:wrap; align-items:stretch; gap:10px; margin:6px 0 14px; }
.eq .t{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:150px; cursor:pointer; text-align:left; }
.eq .t:hover{ border-color:var(--accent); }
.eq .t b{ display:block; font-size:21px; } .eq .t span{ font-size:12.5px; color:var(--mute); }
.eq .o{ align-self:center; font-size:20px; color:var(--mute); font-weight:700; }
.levers3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; }
.levers3 > div{ padding:0 20px; border-left:1.5px solid var(--line); }
.levers3 > div:first-child{ border-left:0; padding-left:0; }

.levers3 p{ font-size:13.5px; margin:0 0 10px; color:var(--ink); }
.levers3 .m{ color:var(--mute); font-size:12.5px; }
.linkb{ border:0; background:none; color:var(--accent-ink); font-weight:600; padding:0; text-decoration:underline; text-underline-offset:3px; font-size:13.5px; }
.gloss{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 30px; }
.gloss div{ font-size:13.5px; } .gloss b{ display:block; font-size:14px; }
.anat{ display:grid; grid-template-columns:230px 1fr; gap:22px; align-items:center; }
.anat .node{ position:relative; cursor:default; }
.anat ol{ margin:0; padding-left:18px; font-size:13.5px; } .anat li{ margin-bottom:5px; }
/* scenarios */
.presets{ display:flex; flex-direction:column; border:1px solid var(--line); border-radius:12px; background:var(--card); margin-bottom:18px; overflow:hidden; }
.preset{ display:grid; grid-template-columns:22px 220px 1fr auto; gap:14px; align-items:center; background:none; border:0; border-top:1px solid var(--line-2); padding:13px 18px; text-align:left; }
.preset:first-child{ border-top:0; }
.preset:hover{ background:var(--grey-card); }
.preset.on{ background:var(--accent-soft); }

.preset b{ font-size:14.5px; } .preset span{ color:var(--mute); font-size:13.5px; } .preset em{ font-style:normal; color:var(--mute); font-size:12.5px; }
.sc-grid{ display:grid; grid-template-columns:minmax(300px,1fr) 1.3fr; gap:18px; }
.lever{ padding:12px 0; border-bottom:1px solid var(--line-2); }
.lever:last-child{ border-bottom:0; }
.lever .lh{ display:flex; justify-content:space-between; gap:10px; font-weight:600; font-size:14px; }
.lever .lh span{ color:var(--accent-ink); font-variant-numeric:tabular-nums; }
.lever p{ margin:2px 0 6px; color:var(--mute); font-size:12.5px; }
.lever input{ width:100%; accent-color:var(--accent); }
.res-cards{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0; margin-bottom:16px; border:1px solid var(--line); border-radius:10px; }
.res{ padding:14px 16px; border-left:1px solid var(--line); border-top:1px solid var(--line); }
.res:nth-child(odd){ border-left:0; } .res:nth-child(-n+2){ border-top:0; }
.res .t{ color:var(--mute); font-size:13px; } .res .v{ font-size:23px; font-weight:700; letter-spacing:-.01em; } .res .d{ font-size:12.5px; font-weight:600; }
.deck-note{ font-size:13px; color:var(--mute); margin-top:12px; }
/* reports */
.rp-top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.rp-list{ background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.rp{ display:grid; grid-template-columns:54px 1.6fr 1.2fr 1fr 110px; gap:16px; align-items:center; width:100%; background:none; border:0; border-top:1px solid var(--line-2); padding:15px 20px; text-align:left; }
.rp:first-child{ border-top:0; }
.rp:hover{ background:var(--grey-card); }
.rp .id{ color:var(--mute); font-weight:600; font-size:13px; }
.rp b{ display:block; font-size:15px; } .rp span{ color:var(--mute); font-size:13px; }
.rp-head{ display:grid; grid-template-columns:54px 1.6fr 1.2fr 1fr 110px; gap:16px; padding:10px 20px; font-size:12.5px; color:var(--mute); border-bottom:1px solid var(--line); }
.modal{ position:fixed; inset:0; z-index:60; display:none; align-items:flex-start; justify-content:center; padding:calc(30px + env(safe-area-inset-top,0px)) 16px 30px; overflow:auto; background:rgba(20,16,44,.35); }
.modal.on{ display:flex; }
.sheet{ background:var(--card); border-radius:14px; width:min(980px,100%); padding:28px 32px; position:relative; }
.sheet .x{ position:absolute; right:16px; top:16px; border:0; background:var(--grey-card); width:34px; height:34px; border-radius:8px; font-size:18px; }
.sheet h3{ font-size:22px; margin:0 0 4px; } .sheet .sub{ color:var(--mute); margin-bottom:18px; }
.mini-kpis{ display:flex; flex-wrap:wrap; margin-bottom:18px; }
.mini-kpis div{ border-left:2px solid var(--orange); padding:0 22px 0 12px; margin-bottom:8px; } .mini-kpis span{ color:var(--mute); font-size:12.5px; display:block; } .mini-kpis b{ font-size:20px; }
/* ask */
.ask{ max-width:960px; }
.qs{ display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 24px; }
.qs button{ text-align:left; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:9px 16px; font-size:14px; }
.qs button:hover{ border-color:var(--accent); color:var(--accent-ink); }
.convo{ display:flex; flex-direction:column; gap:14px; margin-bottom:20px; }
.q-b{ align-self:flex-end; background:var(--side); color:#fff; border-radius:12px 12px 3px 12px; padding:10px 14px; max-width:70%; }
.a-b{ background:var(--card); border:1px solid var(--line); border-radius:12px 12px 12px 3px; padding:16px 18px; max-width:90%; font-size:14.5px; }
.a-b p{ margin:0 0 8px; } .a-b p:last-child{ margin:0; }
.ref-chip{ display:inline; color:var(--accent-ink); font-weight:600; cursor:pointer; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; }
.ask-bar{ display:flex; gap:10px; position:sticky; bottom:0; background:var(--bg); padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px)); }
.ask-bar input{ flex:1; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; font:inherit; font-size:15px; background:var(--card); color:var(--ink); }
.ask-bar input:focus{ border-color:var(--accent); outline:none; }
/* alerts */
.al-top{ display:grid; grid-template-columns:1fr auto; gap:16px; align-items:start; }
.counts{ display:flex; }
.counts div{ border-left:1.5px solid var(--line); padding:0 20px 0 14px; } .counts div:first-child{ border-left:0; } .counts b{ font-size:26px; display:block; line-height:1.1; } .counts span{ color:var(--mute); font-size:13px; }
.al-grid{ display:grid; grid-template-columns:1.25fr 1fr; gap:18px; align-items:start; }
.al-list{ background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.al-card{ padding:14px 18px; border-top:1px solid var(--line-2); display:grid; grid-template-columns:12px 1fr auto; gap:12px; cursor:pointer; }
.al-card:first-child{ border-top:0; }
.al-card.on{ background:var(--accent-soft); }
.al-card .rule{ color:var(--mute); font-size:12.5px; } .al-card .tt{ font-weight:600; font-size:14.5px; margin:2px 0; }
.al-detail{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px 24px; position:sticky; top:96px; }
.al-detail h3{ font-size:21px; margin:8px 0 8px; line-height:1.3; }
.al-detail .sec{ font-size:13.5px; font-weight:700; margin:18px 0 6px; }
.why-li{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line-2); cursor:pointer; }
.why-li b{ display:block; font-size:14px; } .why-li span{ color:var(--mute); font-size:13px; }
.sowhat{ background:var(--sky); border-radius:8px; padding:12px 14px; font-size:14px; }
.subtabs{ display:flex; gap:24px; border-bottom:1px solid var(--line); margin:4px 0 14px; }
.subtabs button{ border:0; background:none; padding:9px 0; font-size:14.5px; color:var(--mute); border-bottom:2.5px solid transparent; margin-bottom:-1px; }
.subtabs button.on{ color:var(--ink); border-color:var(--orange); font-weight:700; }
.pill-f{ display:inline-flex; gap:2px; border:1px solid var(--line); padding:3px; border-radius:8px; margin-bottom:12px; flex-wrap:wrap; background:var(--grey-card); }
.pill-f button{ border:0; background:none; padding:5px 12px; border-radius:6px; font-size:13px; color:var(--mute); }
.pill-f button.on{ background:var(--card); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(28,24,56,.1); }
.empty{ color:var(--mute); padding:20px; }
.del{ border:0; background:none; color:var(--bad); font-size:12.5px; font-weight:600; padding:0 0 0 8px; text-decoration:underline; text-underline-offset:2px; }
.savebar{ display:flex; gap:8px; margin-top:14px; } .savebar[hidden]{ display:none; }
.savebar input, .form input, .form select, .cmt-form input, .cmt-form textarea{ font:inherit; font-size:14px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--card); color:var(--ink); width:100%; }
.savebar input{ flex:1; }
.form{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 16px; margin:8px 0 16px; } .form[hidden]{ display:none; }
.form label{ display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:600; }
.cks{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px 14px; }
.ck{ font-size:13.5px; display:flex; gap:6px; align-items:center; } .ck small{ color:var(--mute); }
.comments{ border-top:1px solid var(--line); margin-top:22px; padding-top:16px; } .comments h4{ margin:0 0 10px; font-size:15px; }
.cmt{ border-left:3px solid var(--orange); padding:4px 0 4px 12px; margin-bottom:12px; } .cmt-h{ display:flex; gap:10px; align-items:baseline; font-size:13px; } .cmt-h span{ color:var(--mute); } .cmt p{ margin:4px 0 0; font-size:14px; }
.cmt-form{ display:grid; gap:8px; max-width:640px; } .cmt-form button{ justify-self:start; }
.trend{ margin-top:12px; } .trend-h{ font-size:12.5px; color:var(--mute); font-weight:600; margin-bottom:2px; }
.preset .del{ margin-left:6px; }
@media (max-width:860px){ .form,.cks{ grid-template-columns:1fr; } }
@media (max-width:1250px){ .stats{ grid-template-columns:repeat(3,minmax(0,1fr)); row-gap:16px; } .stat:nth-child(4){ border-left:0; } .lower,.al-grid,.sc-grid{ grid-template-columns:1fr; } .al-detail{ position:static; } .ov-sec{ grid-template-columns:1fr; gap:10px; } }
@media (max-width:860px){
  .app{ grid-template-columns:1fr; }
  .side{ position:static; height:auto; flex-direction:row; align-items:center; padding:10px 12px; overflow-x:auto; gap:8px; }
  .brand{ padding:0 8px 0 4px; } .brand span{ display:none; } .brand img{ width:120px !important; }
  .nav{ flex-direction:row; } .nav button{ padding:8px 10px; } .nav button .lab{ display:none; }
  .side-foot{ display:none; }
  .top{ padding:12px 16px; position:static; } .page{ padding:18px 16px 60px; }
  .stats{ grid-template-columns:repeat(2,minmax(0,1fr)); } .stat:nth-child(odd){ border-left:0; } .stat:nth-child(4){ border-left:1.5px solid var(--line); }
  .levers3,.gloss{ grid-template-columns:1fr; } .levers3 > div{ border-left:0; padding:0 0 14px; }
  .walk{ grid-template-columns:130px 1fr 70px; } .anat{ grid-template-columns:1fr; }
  .rp,.rp-head{ grid-template-columns:40px 1fr; } .rp > :nth-child(n+3), .rp-head > :nth-child(n+3){ display:none; }
  .preset{ grid-template-columns:22px 1fr; } .preset > :nth-child(n+3){ display:none; }
  .hero h2{ font-size:23px; }
}

 {k:'icn',l:'InCity, 6 cities',r:'InCity network',a:1.15,o:.82,rent:46.0,city:true,real:.985,np:.12,opx:.3,young:true},
 {k:'oth',l:'Other parks (29)',r:'Other parks',a:1.55,o:.95,rent:24.5,fc:.6,real:.99,np:.05,opx:.21},
];
const PARK_BY = Object.fromEntries(PARKS.map(p=>[p.k,p]));

// deterministic noise
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return ((h>>>0)%10000)/10000;}
function noise(s,amp){return (hash(s)-.5)*2*amp;}

// ----- build rows -----
const ROWS=[]; // row grain: park x format x segment
for(const p of PARKS){
  const parts=[];
  if(p.city){ parts.push({f:'city',seg:'ecom',w:.55},{f:'city',seg:'logc',w:.3},{f:'city',seg:'retail',w:.15}); }
  else {
    const fcSegs=SEGMENTS.filter(s=>s.f==='fc'), indSegs=SEGMENTS.filter(s=>s.f==='ind');
    const fw=fcSegs.reduce((a,s)=>a+s.w*(.6+hash(p.k+s.k)),0), iw=indSegs.reduce((a,s)=>a+s.w*(.6+hash(p.k+s.k)),0);
    if(p.fc>0) fcSegs.forEach(s=>parts.push({f:'fc',seg:s.k,w:p.fc*s.w*(.6+hash(p.k+s.k))/fw}));
    if(p.fc<1) indSegs.forEach(s=>parts.push({f:'ind',seg:s.k,w:(1-p.fc)*s.w*(.6+hash(p.k+s.k))/iw}));
  }
  for(const pt of parts){ ROWS.push({id:p.k+'|'+pt.f+'|'+pt.seg,park:p.k,region:p.r,format:pt.f,seg:pt.seg,w:pt.w}); }
}

// growth curve: area factor by month index (actual); young parks ramp faster
function areaF(p,t){ const base = p.young? 0.55 : 0.84; if(t<=LAST_ACTUAL) return base+(1-base)*Math.pow(t/LAST_ACTUAL,1.1); return 1+0.011*(t-LAST_ACTUAL); }
function rentF(t){ return Math.pow(1.048,(t-LAST_ACTUAL)/12); }

// ----- data store -----
// D.row[ver][t][rowId] = {comp,occ,np,rent,real,svc}
// D.park[ver][t][park] = {opex,capex,opAssets,cwip,planYTD,delYTD,daysLate,rentB}
// D.co[ver][t] = {oi,emp,oexp,da,fin,tax,taxPaid,dd,netDebt,shares}
const D={row:{actual:[],budget:[]},park:{actual:[],budget:[]},co:{actual:[],budget:[]}};
for(const ver of ['actual','budget']){
  for(let t=0;t<24;t++){
    if(ver==='actual' && t>LAST_ACTUAL){ D.row[ver][t]=null; D.park[ver][t]=null; D.co[ver][t]=null; continue; }
    const rows={}, parks={};
    let totRev=0, totComp=0;
    for(const p of PARKS){
      const af=areaF(p,t);
      const b = ver==='budget';
      const pk={};
      // occupancy: actual drifts, budget a bit higher at weak parks
      let occ = p.o + noise(p.k+t+'o',.012);
      if(b) occ = Math.min(1, p.o<.95? p.o+.02 : p.o+.002);
      occ=Math.min(1,occ);
      // lease-up lag: area leased but not paying
      let npShare = p.np*.8*(1+noise(p.k+t+'n',.2));
      if(b) npShare = p.np*.62;
      if(t<FY_START && b) npShare=p.np*.55;
      let real = b? .997 : Math.min(.999,p.real+noise(p.k+t+'r',.004));
      const rent = 1.028*p.rent*rentF(t)*(b? (1+ (p.k==='icn'? .03:.004)) : 1)*(1+noise(p.k+t+'p',.003));
      // late deliveries: budget area includes the late blocks from Jul 2026
      let comp = p.a*af;
      if(!b && p.late && t>=15) comp -= p.late*(t>=16?1:.5);
      if(b && p.late && t>=15 && t<FY_START+12) {/* budget has them on time */}
      if(b && t>LAST_ACTUAL) comp = p.a*areaF(p,t);
      let pRev=0;
      for(const r of ROWS.filter(r=>r.park===p.k)){
        const c=comp*r.w;
        const rowRent = rent*(1+noise(r.id+'rr',.06))*(r.format==='ind'?1.04:1);
        const v={comp:c,occ,np:c*occ*npShare,rent:rowRent,real,svc:1.05*(r.format==='city'?1.6:1)};
        rows[r.id]=v;
        const billed=c*occ-v.np; pRev+= (billed*rowRent*real + billed*v.svc)/10;
      }
      totRev+=pRev; totComp+=comp;
      pk.opex = comp*p.opx*(b? .97:1)*(1+noise(p.k+t+'x',.05));
      pk.bad = b? comp*.0008 : comp*(p.real<.98? .0011 : .0007)*(1+noise(p.k+t+'bd',.35));
      const planAnnual = ['bil','dob','ora','hos','icn','xsio','oth'].includes(p.k)? p.a*.18 : 0;
      const ytdM = t>=FY_START? (t-FY_START+1) : 0;
      const lateAmt = (p.late && t>=15)? p.late*(t>=16?1:.5) : 0;
      pk.planYTD = planAnnual*ytdM/12 + lateAmt;
      pk.delYTD = pk.planYTD - (b? 0 : lateAmt);
      pk.daysLate = (!b && p.late && t>=15)? p.lateDays*(t>=16?1:.6) : 0;
      pk.rentB = 1.028*p.rent*rentF(t);
      pk.capex = (planAnnual>0? planAnnual*1.6*210/12 : 1.5) * (b?1: (p.late? .82 : .97)) * (1+noise(p.k+t+'c',.08));
      pk.opAssets = comp*365; // Rs cr per M sqft at cost
      pk.cwip = (planAnnual*2.2+ (p.young? .4:0))*210*(b?.97:1);
      parks[p.k]=pk;
    }
    const co={};
    co.oi = (t>=FY_START? 1.6 : 6.4) + noise('oi'+t+ver,.25) + (ver==='budget'? -.15:0);
    co.emp = 2.2 + t*.04 + (ver==='budget'?-.05:0);
    co.oexp = 5.0 + t*.03 + noise('ox'+t+ver,.3) + (ver==='budget'?-.35:0);
    co.da = 18.5 + t*.4 + (ver==='budget'?-.2:0);
    co.fin = t<FY_START? 47 - t*.3 : 34.4 - (t-FY_START)*.3 + noise('fin'+t,.4) + (ver==='budget'?-.5:0);
    co.dd = ver==='budget'? (t<FY_START? 26-t*0.6 : 18) : (t<FY_START? 26-t*0.65 : 18.8+(t-FY_START)*0.62) + noise('dd'+t,0.4);
    co.netDebt = t<FY_START? 5480 - (5480-4242.2)*(t+1)/12 : (t<16? 4242.2 + 32*(t-11) : 1750.3 + 58*(t-16)) + (ver==='budget' && t>=FY_START? -45:0);
    co.shares = t<FY_START? 168 : 211; // crore shares (illustrative)
    D.row[ver][t]=rows; D.park[ver][t]=parks; D.co[ver][t]=co;
  }
}
// tax: small, set after EBITDA known (computed in engine as share of positive PBT plus minimum)

// ----- lens & aggregation -----
// lens = {format, region, park, seg} values or null
function rowMatch(r,L){ return (!L.format||r.format===L.format)&&(!L.region||r.region===L.region)&&(!L.park||r.park===L.park)&&(!L.seg||r.seg===L.seg); }
function parkMatch(pk,L){ const p=PARK_BY[pk]; return (!L.region||p.r===L.region)&&(!L.park||p.k===L.park); }
function lensLevel(L){ // which grains are valid
  const rowOnly = !!(L.format||L.seg);
  const anyGeo = !!(L.region||L.park);
  return { row:true, park: !rowOnly, co: !rowOnly && !anyGeo };
}

// scenario transform hooks: sc = {lag, bill, rent, occ, late, rate}
function getRow(ver,t,r,sc){ const v=D.row[ver][t]&&D.row[ver][t][r.id]; if(!v) return null; if(!sc||ver!=='actual') return v;
  const o={...v}; const p=PARK_BY[r.park];
  if(sc.lag) o.np = v.np*(1-sc.lag);
  if(sc.bill) o.real = Math.min(.999, v.real + sc.bill);
  if(sc.rent) o.rent = v.rent*(1+sc.rent);
  if(sc.occ) o.occ = Math.min(1, v.occ + sc.occ);
  if(sc.late && p.late && t>=15) { o.comp += p.late*(t>=16?1:.5)*sc.late*r.w; }
  return o; }

function aggregate(L,t,ver,sc){
  const lv=lensLevel(L);
  const S={valid:lv, comp:0,leased:0,np:0,billed:0,owed:0,rental:0,svc:0,lateRow:0};
  if(!D.row[ver][t]) return null;
  for(const r of ROWS){ if(!rowMatch(r,L)) continue; const v=getRow(ver,t,r,sc);
    const leased=v.comp*v.occ, billed=leased-v.np, owed=billed*v.rent/10;
    const pp=PARK_BY[r.park]; if(ver==='actual'&&pp.late&&t>=15) S.lateRow+=pp.late*(t>=16?1:.5)*r.w*(1-((sc&&sc.late)||0));
    S.comp+=v.comp; S.leased+=leased; S.np+=v.np; S.billed+=billed; S.owed+=owed; S.rental+=owed*v.real; S.svc+=billed*v.svc/10; }
  S.rev=S.rental+S.svc; S.compPlan=S.comp+S.lateRow; S.occ=S.comp? S.leased/S.comp:null; S.rent=S.billed? S.owed*10/S.billed:null; S.real=S.owed? S.rental/S.owed:null;
  S.lagMonths = S.billed? S.np/ ( (S.comp*0.012) || 1 ) : null; // not used
  if(lv.park){ let opex=0,bad=0,capex=0,opA=0,cwip=0,plan=0,del=0,late=0,lost=0,dlw=0;
    for(const pk of PARKS){ if(!parkMatch(pk.k,L)) continue; const x=D.park[ver][t][pk.k];
      let lateA=Math.max(0,x.planYTD-x.delYTD); if(sc&&sc.late&&ver==='actual') lateA*= (1-sc.late);
      opex+=x.opex; bad+=x.bad; capex+=x.capex; opA+=x.opAssets; cwip+=x.cwip; plan+=x.planYTD; del+=x.planYTD-lateA; late+=lateA; lost+=lateA*x.rentB/10; dlw+=x.daysLate*lateA; }
    Object.assign(S,{popex:opex,bad,noi:S.rev-opex-bad,capex,opA,cwip,planYTD:plan,delYTD:del,lateA:late,rentLost:lost,daysLate: late? dlw/late:0, yoc: opA? (S.rev-opex-bad)*12/opA:null}); }
  if(lv.co){ const c=D.co[ver][t]; let fin=c.fin; if(sc&&sc.rate&&ver==='actual') fin = c.fin*(1+sc.rate/820);
    S.oi=c.oi; S.emp=c.emp; S.oexp=c.oexp; S.ovh=c.emp+c.oexp; S.ebitda=S.noi+S.oi-S.ovh; S.da=c.da; S.fin=fin;
    S.pbt=S.ebitda-S.da-S.fin; S.tax=0.35+Math.max(0,S.pbt)*.12; S.pat=S.pbt-S.tax; S.margin=S.rev? S.ebitda/S.rev:null;
    S.dd=c.dd; const prevC = t>0? (D.co[ver][t-1]||D.co.actual[t-1]) : c;
    const prevRev = t>0? aggSimpleRev(t-1,ver):S.rev;
    S.wc = c.dd/30*S.rev; S.wcPrev = prevC.dd/30*prevRev; S.wcChg=S.wc-S.wcPrev;
    if(sc){ S.wcChg = c.dd/30*aggSimpleRev(t,ver) - S.wcPrev; }
    S.taxPaid=S.tax; S.cfo=S.ebitda-S.taxPaid-S.wcChg; S.intPaid=S.fin; S.fcf=S.cfo-S.capex-S.intPaid;
    S.netDebt=c.netDebt; S.shares=c.shares;
    S.ebitAnn=(S.ebitda-S.da)*12; S.capEmp=S.opA+S.cwip+S.wc; S.roce=S.capEmp? S.ebitAnn/S.capEmp:null;
    S.icov = S.fin? S.ebitda/S.fin:null; }
  return S; }
const _revCache={};
function aggSimpleRev(t,ver){ const k=t+ver; if(_revCache[k]!=null) return _revCache[k]; let rev=0; const src=D.row[ver][t]||D.row.actual[t]; if(!src) return 0;
  for(const r of ROWS){ const v=src[r.id]; const b=v.comp*v.occ-v.np; rev+=(b*v.rent*v.real+b*v.svc)/10; } return _revCache[k]=rev; }

// LTM sums
function ltm(L,t,ver,key,sc){ let s=0; for(let i=t-11;i<=t;i++){ const S=aggregate(L,i,ver,i===t?sc:null); if(!S||S[key]==null) return null; s+=S[key]; } return s; }


</script>

function vals(L,t,ver,sc){ if(t<0) return null; const key=JSON.stringify([L,t,ver,sc||0]); if(cache.has(key)) return cache.get(key);
  const S=aggregate(L,t,ver,sc); if(S && S.valid.co){ const pl=t>=11? ltm(L,t,ver,'pat',sc):null, el=t>=11? ltm(L,t,ver,'ebitda',sc):null;
    S.patLTM=pl; S.ebitdaLTM=el; S.eps= pl!=null? pl/S.shares : null; S.nde = el? S.netDebt/el : null; }

  if(S){ S.maint=S.svc*SH.svc.maint; S.ooi=S.svc*SH.svc.ooi;
    if(t>=12){ const Y=aggregate(L,t-12,'actual'); if(Y&&Y.rent){ S.rentLY=Y.rent; S.rentEsc=Y.rent*0.0475; S.rentMix=S.rent-S.rentLY-S.rentEsc; } } }
  if(S && S.valid.co){ for(const k in SH.ox) S['ox_'+k]=S.oexp*SH.ox[k]; }
  cache.set(key,S); return S; }
function cmpOf(L,t,mode,sc){ mode=mode||state.cmp; if(mode==='budget') return vals(L,t,'budget'); if(mode==='ly') return t>=12? vals(L,t-12,'actual'):null; return t>=1? vals(L,t-1,'actual'):null; }

// ---------- formatting ----------
function num(v,dp){ if(v==null||!isFinite(v)) return '–'; const s=Math.abs(v).toLocaleString('en-IN',{minimumFractionDigits:dp,maximumFractionDigits:dp}); return (v<0?MINUS:'')+s; }
function fv(u,v){ if(v==null||!isFinite(v)) return {m:'–',s:''};
  switch(u){ case 'cr': return {m:num(v,Math.abs(v)>0&&Math.abs(v)<0.1?2:1),s:'Cr'}; case 'msf': return {m:num(v,2),s:'M sq ft'}; case 'psf': return {m:rs(v,1),s:'/sq ft'};
   case 'pct': return {m:num(v*100,1)+'%',s:''}; case 'days': return {m:num(v,0),s:'days'}; case 'x': return {m:num(v,2)+'x',s:''}; case 'rs': return {m:rs(v,2),s:''}; case 'crn': return {m:num(v,0),s:'Cr'}; }
  return {m:num(v,1),s:''}; }
function fvs(u,v){ const x=fv(u,v); return x.s && x.s!=='Cr'? x.m+' '+x.s.replace(/^\//,'per '): x.m+(x.s==='Cr'?' Cr':''); }
function delta(u,a,b,dir){ if(a==null||b==null||!isFinite(a)||!isFinite(b)) return {txt:'',cls:'flat'};
  const d=a-b; let txt;
  if(u==='pct'){ txt=(d>=0?'+':MINUS)+num(Math.abs(d*100),1)+' pts'; }
  else { const dp = u==='msf'||u==='x'||u==='rs'? 2 : (u==='days'||u==='crn'?0:1); const zr=Math.abs(d)<0.5*Math.pow(10,-dp); const abs=zr? num(0,dp) : (d>=0?'+':MINUS)+num(Math.abs(d),dp).replace(MINUS,'');
    let pc=''; if(!(Math.abs(b)<1e-9 || (a<0)!==(b<0) || b<0)) pc=(d>=0?'+':MINUS)+num(Math.abs(d/b*100),1)+'%'; txt=pc? abs+' '+pc : abs; }
  const rel = u==='pct'? Math.abs(d)/0.1 : Math.abs(d)/Math.max(Math.abs(b),1e-9);
  const flatLim = u==='pct'? 0.003/0.1 : 0.03;
  const cls = rel<flatLim? 'flat' : (d*dir>0?'good':'bad');
  return {txt,cls,d}; }

function renderNav(){ const al=alertsFor(state.t).filter(a=>a.status==='open'||a.status==='esc').length;
  $('#nav').innerHTML=[['ov','Overview'],['tree','Value tree'],['sc','Scenarios'],['rp','Reports'],['ask','Ask'],['al','Alerts']].map(([k,l])=>`<button class="${state.view===k?'on':''}" data-v="${k}">${ICONS[k]}<span class="lab">${l}</span>${k==='al'&&al?`<span class="badge">${al}</span>`:''}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{ state.view=b.dataset.v; renderAll(); window.scrollTo(0,0); }); }
function opt(v,l,cur){ return `<option value="${v}" ${cur===v?'selected':''}>${esc(l)}</option>`; }
function renderFilters(){ const L=state.L; const v=state.view; const top=$('.top');
  if(v==='ov'){ top.style.display='none'; return; } top.style.display='';
  const months=MONTHS.slice(0,LAST_ACTUAL+1).slice().reverse();
  const parks=PARKS.filter(p=>!L.region||p.r===L.region);
  const segs=SEGMENTS.filter(s=>!L.format||s.f===L.format||(L.format==='city'&&['ecom','logc','retail'].includes(s.k)));
  const full = v==='tree';
  let html=`<div class="sel"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="color:var(--mute)"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><select id="fMonth" aria-label="Month">${months.map(m=>opt(String(m.i),m.label,String(state.t))).join('')}</select></div>`;
  if(full) html+=`<div class="seg" role="group" aria-label="Compare with"><span>vs</span>${['ly','lm','budget'].map(k=>`<button data-c="${k}" class="${state.cmp===k?'on':''}">${k==='budget'?'Plan (illustrative)':CMP_L[k]}</button>`).join('')}</div>
   <div class="sel"><label for="fFormat">Building</label><select id="fFormat">${opt('','All',L.format||'')}${FORMATS.map(f=>opt(f.k,f.l,L.format)).join('')}</select></div>
   <div class="sel"><label for="fRegion">Region</label><select id="fRegion">${opt('','All',L.region||'')}${REGIONS.map(r=>opt(r,r,L.region)).join('')}</select></div>
   <div class="sel"><label for="fPark">Park</label><select id="fPark">${opt('','All',L.park||'')}${parks.map(p=>opt(p.k,p.l,L.park)).join('')}</select></div>
   <div class="sel"><label for="fSeg">Industry</label><select id="fSeg">${opt('','All',L.seg||'')}${segs.map(s=>opt(s.k,s.l,L.seg)).join('')}</select></div>`;
  $('#filters').innerHTML=html;
  $('#fMonth').onchange=e=>{state.t=+e.target.value; renderAll();};
  if(!full) return;
  $('#filters').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{state.cmp=b.dataset.c; renderAll();});
  $('#fFormat').onchange=e=>{state.L.format=e.target.value||null; if(state.L.seg && SEGMENTS.find(s=>s.k===state.L.seg).f!==state.L.format && state.L.format!=='city') state.L.seg=null; renderAll();};
  $('#fRegion').onchange=e=>{state.L.region=e.target.value||null; if(state.L.park&&PARK_BY[state.L.park].r!==state.L.region) state.L.park=null; renderAll();};
  $('#fPark').onchange=e=>{state.L.park=e.target.value||null; if(state.L.park) state.L.region=PARK_BY[state.L.park].r; renderAll();};
  $('#fSeg').onchange=e=>{state.L.seg=e.target.value||null; renderAll();};
}
function lensText(){ const L=state.L, parts=[];
  if(L.park) parts.push(PARK_L[L.park]); else if(L.region) parts.push(L.region);
  if(L.format) parts.push(FMT_L[L.format]); if(L.seg) parts.push(SEG_L[L.seg]); return parts.join(', '); }
function lensNote(){ const lv=lensLevel(state.L); const t=lensText(); if(!t) return '';
  const known = lv.co? '' : lv.park? 'Head office, interest and tax are company-level and left blank.' : 'Running costs are held by park and interest by company, so boxes above revenue are left blank.';
  return `<div class="lens-note">Filtered to <b>${esc(t)}</b>. ${known}<button id="clrLens">Clear filters</button></div>`; }
// ---------- KPI strip ----------
function spark(fn){ const pts=[]; for(let i=Math.max(0,state.t-11);i<=state.t;i++){ const S=vals(state.L,i,'actual'); const v=S?fn(S):null; if(v!=null&&isFinite(v)) pts.push(v); }
  if(pts.length<2) return ''; const mn=Math.min(...pts),mx=Math.max(...pts),r=mx-mn||1; const w=86,h=30;
  const d=pts.map((v,i)=>`${(i/(pts.length-1)*w).toFixed(1)},${(h-(v-mn)/r*h+2).toFixed(1)}`).join(' ');
  const last=d.split(' ').pop().split(',');
  return `<svg viewBox="0 0 ${w} ${h+4}" aria-hidden="true"><polyline points="${d}" fill="none" stroke="var(--g1)" stroke-width="1.6"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="var(--g2)"/></svg>`; }

// ---------- bridge ----------
function rowV(r,t,ver,sc){ const v=getRow(ver,t,r,sc); if(!v) return null; const leased=v.comp*v.occ, billed=leased-v.np; return {...v,leased,billed}; }
function bridge(L,t,mode,sc){ // returns steps from comparison to actual
  const lv=lensLevel(L); const A={t,ver:'actual',sc}; let B;
  if(sc) B={t,ver:'actual',sc:null}; else if(mode==='budget') B={t,ver:'budget'}; else if(mode==='ly'){ if(t<12) return null; B={t:t-12,ver:'actual'}; } else { if(t<1) return null; B={t:t-1,ver:'actual'}; }
  const keys=['area','occ','lag','rent','bill','svc']; const steps={}; keys.forEach(k=>steps[k]={v:0,by:{}});
  const add=(k,p,v)=>{ steps[k].v+=v; steps[k].by[p]=(steps[k].by[p]||0)+v; };
  for(const r of ROWS){ if(!rowMatch(r,L)) continue; const a=rowV(r,A.t,A.ver,A.sc), b=rowV(r,B.t,B.ver,B.sc); if(!a||!b) continue;

    add('rent',r.park,a.billed*(a.rent-b.rent)*b.real/10); add('bill',r.park,a.billed*a.rent*(a.real-b.real)/10); add('svc',r.park,a.billed*(a.svc-b.svc)/10); }

  const out=keys.map(k=>({k,l:lab[k],v:steps[k].v,by:steps[k].by}));
  let metric='revenue', a=SA.rev, b=SB.rev;

    const byb={}; for(const p of PARKS){ if(!parkMatch(p.k,L)) continue; byb[p.k]=-(D.park.actual[A.t][p.k].bad-D.park[B.ver][B.t][p.k].bad); }

const PHR={area:['buildings finishing late','more finished space'],occ:['a smaller share of space leased','more of the space leased'],lag:['signed space where rent has not started','rent starting sooner on signed space'],rent:['lower rent per sq ft','higher rent per sq ft'],bill:['rent owed under the leases but not billed','more of the rent owed billed'],svc:['lower service charges','higher service charges'],popex:['higher park running costs','lower park running costs'],bad:['more bad debt written off','less bad debt'],oi:['less interest income','more interest income'],ovh:['higher head office costs','lower head office costs']};

function bridgeBox(){ const L=state.L; const br=bridge(L,state.t,state.cmp,state.treeSc); const lbl=cmpLabel();

function trendSVG(meta){ const pts=[], bud=[]; const t0=Math.max(0,state.t-11);
  for(let i=t0;i<=state.t;i++){ const A=vals(state.L,i,'actual'), B=vals(state.L,i,'budget'); pts.push(A?meta.v(A):null); bud.push(B?meta.v(B):null); }

  const P=arr=>arr.map((v,i)=>v==null?null:`${(i/(n-1)*(w-20)+10).toFixed(1)},${(h-12-(v-mn)/r*(h-30)).toFixed(1)}`).filter(Boolean).join(' ');
  const labs=[t0,state.t].map((i,j)=>`<text x="${j?w-10:10}" y="${h}" font-size="11" fill="var(--mute)" text-anchor="${j?'end':'start'}">${MONTHS[i].label}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h+4}" style="width:100%;height:auto"><polyline points="${P(bud)}" fill="none" stroke="var(--mute)" stroke-dasharray="4 4" stroke-width="1.4"/><polyline points="${P(pts)}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>${labs}<line x1="${w-170}" y1="8" x2="${w-150}" y2="8" stroke="var(--accent)" stroke-width="2.2"/><text x="${w-145}" y="12" font-size="11" fill="var(--mute)">Actual</text><line x1="${w-90}" y1="8" x2="${w-70}" y2="8" stroke="var(--mute)" stroke-dasharray="4 4" stroke-width="1.4"/><text x="${w-65}" y="12" font-size="11" fill="var(--mute)">Plan</text></svg>`; }

function dimValues(dim){ const L=state.L; if(dim==='park') return PARKS.filter(p=>parkMatch(p.k,L)).map(p=>[p.k,p.l]); if(dim==='region') return REGIONS.filter(r=>!L.region||r===L.region).map(r=>[r,r]); if(dim==='format') return FORMATS.filter(f=>!L.format||f.k===L.format).map(f=>[f.k,f.l]); return SEGMENTS.filter(s=>!L.seg||s.k===L.seg).map(s=>[s.k,s.l]); }

function readFor(id,meta,S,C){ if(!C) return 'No comparison figures for this month.';
  const a=meta.v(S), b=meta.v(C); const dl=delta(meta.u,a,b,meta.dir); const word = dl.cls==='flat'? 'In line with' : (dl.cls==='good'?'Better than':'Worse than');

  if(['ebitda','pat','pbt'].includes(id) && S.valid.co){ const br=bridge(state.L,state.t,state.cmp,state.treeSc); if(br){ const top=br.steps.slice().sort((x,y)=>Math.abs(y.v)-Math.abs(x.v)).slice(0,3); s+=bridgeSummary(br,cmpLabel()).replace(/^[^.]*\. /,'')+(id!=='ebitda'?` Depreciation and interest together moved by ${rs((S.da+S.fin)-(C.da+C.fin),1)} cr.`:''); } return s; }
  const dims=splitDims(meta); if(!dims.length) return s+'Company-level number, so there is no split below it.';
  let by; if(!state.L.park) by=PARKS.filter(p=>parkMatch(p.k,state.L)).map(p=>({l:p.l,L2:{...state.L,park:p.k,region:p.r}}));
  else if(meta.g==='row') by=SEGMENTS.filter(x=>!state.L.seg||x.k===state.L.seg).map(x=>({l:x.l,L2:{...state.L,seg:x.k}}));
  else return s+'One park is selected, so there is nothing further to split.';
  const parts=by.map(o=>{ const x=vals(o.L2,state.t,'actual',state.treeSc), y=state.treeSc?vals(o.L2,state.t,'actual'):cmpOf(o.L2,state.t); if(!x||!y||x.comp<1e-6) return null; return {l:o.l,d:meta.v(x)-meta.v(y),a:meta.v(x)}; }).filter(Boolean);
  if(['cr','msf'].includes(meta.u)){ parts.sort((x,y)=>(x.d*meta.dir)-(y.d*meta.dir)); const worst=parts.slice(0,3).filter(x=>x.d*meta.dir<0);

  return s; }

  if(/not pay|lease-up|fit|waiting|lease faster|leased space/.test(ql)){ const rows=PARKS.map(p=>({p,a:vals({park:p.k},t,'actual')})).sort((x,y)=>y.a.np-x.a.np).slice(0,3);

function trendBlock(id,L,label){ L=L||{}; const m=N[id]; const t0=Math.max(0,state.t-5); const xs=[],a=[],b=[];
  for(let i=t0;i<=state.t;i++){ const A=vals({format:null,region:null,park:null,seg:null,...L},i,'actual'), B=vals({format:null,region:null,park:null,seg:null,...L},i,'budget'); xs.push(MONTHS[i].label.split(' ')[0]); a.push(A?m.v(A):null); b.push(B?m.v(B):null); }
  return `<div class="trend"><div class="trend-h">${esc(label||m.l)}, last six months</div><div class="tw"><table class="t"><thead><tr><th></th>${xs.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody><tr><td>Actual</td>${a.map(v=>`<td><b>${fv(m.u,v).m}</b></td>`).join('')}</tr><tr><td>Plan</td>${b.map(v=>`<td>${fv(m.u,v).m}</td>`).join('')}</tr></tbody></table></div></div>`; }
function trendFor(q){ const ql=q.toLowerCase(); const park=PARKS.find(p=>ql.includes(p.l.toLowerCase().split(/[ ,(]/)[0].toLowerCase()) && p.k!=='oth');
  if(park){ const L={park:park.k,region:park.r}; return /bill|owed/.test(ql)? trendBlock('real',L,`${park.l}: rent billed vs owed`) : /occup/.test(ql)? trendBlock('occ',L,`${park.l}: occupancy`) : trendBlock('noi',L,`${park.l}: park profit`); }
  if(/bill|leak|owed/.test(ql)) return trendBlock('real');
  if(/not pay|lease-up|fit|waiting|started|leased space/.test(ql)) return trendBlock('np');
  if(/cash|fcf|debt/.test(ql)) return trendBlock('fcf')+trendBlock('dd');
  if(/well|good|better|positive|last year|yoy|year ago|revenue|hurt/.test(ql)) return trendBlock('rev');
  if(/late|delay|construct|build/.test(ql)) return trendBlock('late');
  if(/occup|vacan|empty/.test(ql)) return trendBlock('occ');
  if(/profit|break|turn|pat|budget|miss|ebitda|why/.test(ql)) return trendBlock('pat')+trendBlock('ebitda');
  return ''; }

function walkHTML(S){ const steps=[['Revenue','',S.rev,'tot'],['Park running costs','',-S.popex],['Bad debt','',-S.bad],['Head office costs','',-S.ovh],['Interest and other income','',S.oi],['EBITDA',`${num(S.margin*100,0)}% margin`,S.ebitda,'tot'],['Depreciation','',-S.da],['Interest','',-S.fin],['Tax','',-S.tax],['Net profit','',S.pat,'tot']];
  const max=S.rev*1.04; const X=v=>v/max*100; let run=0; let out='';
  for(const [l,s,v,tot] of steps){ let left,width,col;
    if(tot){ left=Math.min(0,v); width=Math.abs(v); run=v; col=v<0?'var(--bad)':'var(--tot)'; left=v<0?0:0; }
    else { const a=run, b=run+v; left=Math.min(a,b); width=Math.abs(v); run=b; col=v<0?'var(--bad)':'var(--good)'; }
    const lp=Math.max(0,X(left)), wp=Math.max(.5,X(width));
    out+=`<div class="wl ${tot?'tot':''}" style="${tot?'font-weight:700':''}">${l}<small>${s}</small></div><div class="wb"><div style="left:${lp}%;width:${wp}%;background:${col}"></div></div><div class="wv ${v<0&&!tot?'bad-t':''}">${v<0?MINUS:(tot?'':'+')}${num(Math.abs(v),1)}</div>`; }
  return `<div class="walk">${out}</div>`; }

  const billParks=PARKS.map(p=>({p,a:vals({park:p.k},t,'actual')})).sort((x,y)=>(y.a.owed-y.a.rental)-(x.a.owed-x.a.rental)).slice(0,2).map(x=>x.p.l);
  h+=`<section class="ov-sec"><div><h3>Three levers that move profit</h3></div><div class="levers3">
   <div><h4>Get rent started sooner</h4><div class="big">${num(S.np,2)}M sq ft</div><p>leased with rent not yet started, against ${num(B.np,2)}M in the illustrative plan: ${rs(npRent,1)} cr of rent a month waiting.</p><div class="m">Rent starting a month sooner is worth about ₹16 cr a year.</div><p style="margin-top:8px"><button class="linkb" data-on="np">Open in the tree</button></p></div>
   <div><h4>Bill all the rent owed</h4><div class="big">${num(S.real*100,1)}%</div><p>of rent owed was billed. ${rs(missed,1)} cr missed this month, mostly at ${billParks.join(' and ')}.</p><div class="m">Each extra point billed is worth about ₹8 cr a year.</div><p style="margin-top:8px"><button class="linkb" data-on="real">Open in the tree</button></p></div>
   <div><h4>Finish buildings on time</h4><div class="big">${num(S.lateA,2)}M sq ft</div><p>planned by now and not yet finished. Late blocks at ${lateParks.join(', ')} cost ${rs(S.rentLost,1)} cr of rent this month.</p><div class="m">Each 1M sq ft finished a month late costs about ₹2.75 cr of rent.</div><p style="margin-top:8px"><button class="linkb" data-on="late">Open in the tree</button></p></div></div></section>`;
  h+=`<section class="ov-sec"><div><h3>Gap to the illustrative plan</h3></div><div><p class="para" style="font-size:15px">${bridgeSummary(br,'the illustrative plan')} Interest and depreciation together were ${rs((S.da+S.fin)-(B.da+B.fin),1)} cr over plan.</p><p class="para"><button class="linkb" id="goTree">Go to the value tree</button></p></div></section>`;
  return h; }
function bindOv(){ const p=$('#page'); p.querySelectorAll('[data-on]').forEach(b=>b.onclick=()=>{ if(b.dataset.tabgo){ state.tab=b.dataset.tabgo; } openNode(b.dataset.on); });
  const g=$('#goTree'); if(g) g.onclick=()=>{ state.view='tree'; state.tab='pat'; renderAll(); window.scrollTo(0,0); }; }

// ---------- render ----------
function renderPage(){ const p=$('#page'); const v=state.view;
  if(v==='ov'){ p.innerHTML=viewOv(); bindOv(); }
  else if(v==='tree'){ p.innerHTML=viewTree(); bindTreeView(); }
  else if(v==='sc'){ p.innerHTML=viewSc(); bindSc(); }
  else if(v==='rp'){ p.innerHTML=viewRp(); bindRp(); }
  else if(v==='ask'){ p.innerHTML=viewAsk(); bindAsk(); }
  else { p.innerHTML=viewAl(); bindAl(); }
  p.querySelectorAll('.stat[data-node]').forEach(k=>k.onclick=()=>openNode(k.dataset.node)); }
function renderAll(){ renderNav(); renderFilters(); renderPage(); }
$('#dClose').onclick=closeDrawer; $('#scrim').onclick=closeDrawer;
$('#modal').onclick=e=>{ if(e.target.id==='modal') $('#modal').classList.remove('on'); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(state.full&&!$('#drawer').classList.contains('open')){ state.full=null; document.body.style.overflow=''; renderPage(); } closeDrawer(); $('#modal').classList.remove('on'); } });
$('#resetBtn').onclick=()=>{ Object.assign(state,{view:'ov',t:LAST_ACTUAL,cmp:'ly',L:{format:null,region:null,park:null,seg:null},tab:'pat',collapsed:{popex:true,ovh:true},zoom:{},treeSc:null,sc:{lag:0,bill:0,rent:0,occ:0,late:0,rate:0},preset:null,convo:[]}); closeDrawer(); renderAll(); };
let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(state.view==='tree') TABS[state.tab].trees.forEach(applyZoom); },120); });
renderAll();

</script>
