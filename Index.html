<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horizon Industrial Parks · Value Tree Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --side:#1E2147; --side-2:#2A2E5C; --side-ink:#E6E7F5; --side-mute:#A3A6CC;
  --accent:#6A4CF5; --accent-soft:#EEEAFE; --accent-ink:#4A31D1;
  --bg:#F3F4F8; --card:#FFFFFF; --ink:#1B1E3D; --mute:#666A86; --line:#DFE1EA; --line-2:#ECEDF3;
  --bad:#C9433F; --bad-soft:#FBE6E5; --good:#1F9A86; --good-soft:#DDF3EE; --flat:#9A9DB3; --flat-soft:#EEEFF4;
  --amber:#C88A1E; --amber-soft:#FBF0D9; --grey-card:#F6F7FA;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --side:#14162F; --side-2:#232655; --side-ink:#E6E7F5; --side-mute:#9598C0;
  --accent:#8C74FF; --accent-soft:#2A2550; --accent-ink:#B9AAFF;
  --bg:#101225; --card:#191C36; --ink:#E9EAF6; --mute:#A0A3C0; --line:#2E3256; --line-2:#262A4A;
  --bad:#F07A73; --bad-soft:#3A1E26; --good:#4DC9B2; --good-soft:#163430; --flat:#8A8DA8; --flat-soft:#24274A;
  --amber:#E6B04E; --amber-soft:#3A3020; --grey-card:#1E2140; color-scheme: dark; } }
:root[data-theme="dark"]{
  --side:#14162F; --side-2:#232655; --side-ink:#E6E7F5; --side-mute:#9598C0;
  --accent:#8C74FF; --accent-soft:#2A2550; --accent-ink:#B9AAFF;
  --bg:#101225; --card:#191C36; --ink:#E9EAF6; --mute:#A0A3C0; --line:#2E3256; --line-2:#262A4A;
  --bad:#F07A73; --bad-soft:#3A1E26; --good:#4DC9B2; --good-soft:#163430; --flat:#8A8DA8; --flat-soft:#24274A;
  --amber:#E6B04E; --amber-soft:#3A3020; --grey-card:#1E2140; color-scheme: dark; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:Archivo, "Helvetica Neue", Arial, sans-serif; font-size:14px; line-height:1.45; }
button{ font:inherit; color:inherit; cursor:pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.app{ display:grid; grid-template-columns:248px 1fr; height:100%; }
/* sidebar */
.side{ background:var(--side); color:var(--side-ink); display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0; height:100vh; height:100dvh; }
.brand{ display:flex; gap:12px; align-items:center; padding:4px 6px 22px; }
.logo{ width:40px; height:40px; border-radius:9px; background:var(--accent); display:grid; place-items:center; font-weight:700; color:#fff; letter-spacing:.02em; }
.brand b{ display:block; font-size:16px; } .brand span{ color:var(--side-mute); font-size:13px; }
.nav{ display:flex; flex-direction:column; gap:4px; }
.nav button{ display:flex; align-items:center; gap:14px; background:none; border:0; color:var(--side-ink); padding:11px 12px; border-radius:9px; text-align:left; font-size:15px; }
.nav button:hover{ background:rgba(255,255,255,.05); }
.nav button.on{ background:var(--side-2); font-weight:600; }
.nav svg{ width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:1.7; }
.badge{ margin-left:auto; background:var(--bad); color:#fff; border-radius:999px; font-size:12px; min-width:22px; height:22px; display:grid; place-items:center; font-weight:600; }
.side-foot{ margin-top:auto; color:var(--side-mute); font-size:12.5px; padding:6px; }
.side-foot button{ background:none; border:0; color:var(--side-ink); padding:8px 0 0; font-weight:600; }
/* main */
.main{ min-width:0; display:flex; flex-direction:column; }
.top{ background:var(--card); border-bottom:1px solid var(--line); padding:16px 28px 14px; position:sticky; top:env(safe-area-inset-top,0px); z-index:20; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--card); }
.co-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
.co-row h1{ font-size:21px; margin:0; font-weight:600; letter-spacing:-.01em; }
.chip{ background:var(--accent-soft); color:var(--accent-ink); border-radius:999px; padding:4px 12px; font-size:13px; font-weight:500; display:inline-flex; gap:8px; align-items:center; }
.chip::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }
.filters{ display:flex; gap:10px; flex-wrap:wrap; }
.sel{ position:relative; display:flex; align-items:center; border:1px solid var(--line); border-radius:9px; background:var(--card); padding:0 10px 0 12px; height:40px; gap:6px; }
.sel label{ color:var(--mute); font-size:14px; white-space:nowrap; }
.sel select{ appearance:none; border:0; background:transparent; font:inherit; font-weight:600; color:var(--ink); padding:0 22px 0 2px; height:38px; cursor:pointer; max-width:150px; }
.sel::after{ content:""; position:absolute; right:12px; top:16px; width:7px; height:7px; border-right:1.8px solid var(--mute); border-bottom:1.8px solid var(--mute); transform:rotate(45deg); pointer-events:none; }
.sel select option{ color:#1B1E3D; }
.seg{ display:inline-flex; background:var(--grey-card); border:1px solid var(--line); border-radius:9px; padding:3px; align-items:center; height:40px; }
.seg span{ color:var(--mute); padding:0 10px; font-size:13px; }
.seg button{ border:0; background:none; padding:6px 13px; border-radius:7px; font-size:14px; color:var(--ink); }
.seg button.on{ background:var(--card); font-weight:600; box-shadow:0 1px 2px rgba(20,22,60,.12); }
.page{ padding:22px 28px 60px; }
.lens-note{ margin:0 0 16px; color:var(--mute); font-size:13.5px; max-width:1100px; }
.lens-note button{ margin-left:6px; }
.lens-note b{ color:var(--ink); font-weight:600; }
.lens-note button{ border:1px solid var(--line); background:var(--card); border-radius:999px; padding:3px 10px; font-size:12.5px; }
/* KPI strip */
.kpis{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:14px; margin-bottom:18px; }
.kpi{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 16px 14px; position:relative; overflow:hidden; min-height:128px; cursor:pointer; text-align:left; }
.kpi::before{ content:""; position:absolute; left:18px; right:18px; top:0; height:4px; border-radius:0 0 3px 3px; background:var(--flat); }
.kpi.bad::before{ background:var(--bad); } .kpi.good::before{ background:var(--good); }
.kpi .t{ color:var(--mute); font-size:14px; font-weight:500; }
.kpi .v{ font-size:27px; font-weight:600; letter-spacing:-.02em; margin:4px 0 2px; }
.kpi .c{ color:var(--mute); font-size:13px; }
.kpi .d{ font-size:13.5px; font-weight:600; margin-top:2px; }
.kpi.na .v{ color:var(--flat); font-size:16px; font-weight:500; margin-top:10px; }
.kpi svg{ position:absolute; right:14px; bottom:16px; width:86px; height:34px; }
.up-bad,.dn-bad,.bad-t{ color:var(--bad); } .good-t{ color:var(--good); } .flat-t{ color:var(--flat); }
/* tabs row */
.tabrow{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:14px; }
.tabs{ display:inline-flex; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:4px; }
.tabs button{ border:0; background:none; padding:8px 16px; border-radius:7px; font-size:15px; }
.tabs button.on{ background:var(--grey-card); font-weight:600; }
.legend{ display:flex; gap:16px; color:var(--mute); font-size:13.5px; flex-wrap:wrap; }
.legend i{ display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
/* tree panels */
.panels{ display:grid; gap:16px; }
.panel{ background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; position:relative; }
.panel-h{ display:flex; align-items:center; gap:10px; padding:14px 20px; border-bottom:1px solid var(--line-2); }
.panel-h h2{ font-size:17px; margin:0; font-weight:600; }
.panel-h .sq{ width:11px; height:11px; border-radius:3px; background:var(--ink); }
.panel-h .sub{ color:var(--mute); font-size:13px; }
.panel-h .r{ margin-left:auto; display:flex; gap:8px; }
.btn{ border:1px solid var(--line); background:var(--card); border-radius:8px; padding:7px 12px; font-size:13.5px; }
.btn.pri{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
.tree-wrap{ position:relative; overflow:auto; padding:18px 20px 70px; }
.tree-inner{ position:relative; transform-origin:0 0; }
.tree-svg{ position:absolute; inset:0; overflow:visible; pointer-events:none; }
.col-label{ position:absolute; font-size:11.5px; color:var(--mute); font-weight:600; letter-spacing:.03em; }
.node{ position:absolute; width:196px; height:94px; background:var(--card); border:1px solid var(--line); border-radius:9px; padding:9px 12px 8px 15px; cursor:pointer; text-align:left; overflow:hidden; }
.node::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--flat); }
.node.bad::before{ background:var(--bad); } .node.good::before{ background:var(--good); }
.node:hover{ border-color:var(--accent); }
.node.sel{ box-shadow:0 0 0 2px var(--accent); }
.node.alt{ background:var(--grey-card); }
.node.ref{ border-style:dashed; }
.node .n{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:18px; }
.node .val{ font-size:21px; font-weight:600; letter-spacing:-.01em; margin-top:1px; }
.node .val small{ font-size:12px; color:var(--mute); font-weight:500; margin-left:3px; }
.node .ft{ display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--mute); margin-top:3px; gap:4px; white-space:nowrap; }
.node .ft span:first-child{ overflow:hidden; text-overflow:ellipsis; }
.dchip{ border-radius:5px; padding:2px 6px; font-weight:600; font-size:12px; white-space:nowrap; }
.dchip.bad{ background:var(--bad-soft); color:var(--bad); } .dchip.good{ background:var(--good-soft); color:var(--good); } .dchip.flat{ background:var(--flat-soft); color:var(--mute); }
.node.off{ background:repeating-linear-gradient(135deg,var(--grey-card) 0 8px, var(--card) 8px 16px); cursor:default; }
.node.off::before{ background:var(--line); }
.node.off .val{ font-size:13px; color:var(--mute); font-weight:500; margin-top:10px; }
.node .ext{ position:absolute; right:8px; top:8px; width:18px; height:18px; color:var(--accent); }
.op{ position:absolute; width:20px; height:20px; border-radius:50%; background:var(--card); border:1px solid var(--line); display:grid; place-items:center; font-size:13px; color:var(--mute); font-weight:600; line-height:1; }
.tog{ position:absolute; height:22px; min-width:22px; padding:0 5px; border-radius:11px; background:var(--card); border:1px solid var(--line); font-size:11.5px; font-weight:600; color:var(--ink); display:grid; place-items:center; }
.tog:hover{ border-color:var(--accent); color:var(--accent); }
.edge-note{ position:absolute; font-size:11.5px; color:var(--mute); }
.zoom{ position:absolute; right:16px; bottom:14px; display:flex; align-items:center; gap:2px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:4px; box-shadow:0 2px 10px rgba(20,22,60,.08); z-index:2; }
.zoom button{ border:0; background:none; padding:6px 10px; border-radius:6px; font-size:13.5px; }
.zoom button:hover{ background:var(--grey-card); }
.zoom span{ color:var(--mute); font-size:13px; min-width:44px; text-align:center; }
.zoom i{ width:1px; height:20px; background:var(--line); margin:0 4px; }
/* lower row */
.lower{ display:grid; grid-template-columns:1.25fr 1fr; gap:16px; margin-top:16px; }
.box{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 22px; }
.box h3{ margin:0; font-size:18px; font-weight:600; }
.box .sub{ color:var(--mute); font-size:13.5px; margin:2px 0 14px; }
.box-h{ display:flex; align-items:flex-start; gap:12px; justify-content:space-between; flex-wrap:wrap; }
.bridge-row{ display:grid; grid-template-columns:minmax(150px,240px) 1fr 70px; align-items:center; gap:12px; padding:6px 0; }
.bridge-row .lbl{ font-size:14.5px; display:flex; gap:6px; align-items:center; }
.bridge-row .lbl button{ border:0; background:none; padding:0; width:18px; color:var(--mute); font-weight:600; }
.bridge-row.tot .lbl{ font-weight:600; }
.bar-track{ position:relative; height:20px; }
.bar{ position:absolute; top:0; height:20px; border-radius:4px; }
.bar.tot{ background:var(--side); } .bar.neg{ background:var(--bad); } .bar.pos{ background:var(--good); }
:root[data-theme="dark"] .bar.tot{ background:#5A5E9A; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .bar.tot{ background:#5A5E9A; } }
.bridge-row .num{ text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
.sub-rows{ padding:2px 0 8px 26px; border-left:2px solid var(--line-2); margin-left:8px; }
.sub-rows div{ display:flex; justify-content:space-between; font-size:13px; color:var(--mute); padding:2px 0; }
.check{ border-top:1px solid var(--line); margin-top:12px; padding-top:12px; color:var(--mute); font-size:13px; }
.alert-li{ display:grid; grid-template-columns:14px 1fr auto; gap:10px; padding:12px 0; border-bottom:1px solid var(--line-2); cursor:pointer; }
.alert-li:last-child{ border-bottom:0; }
.dot{ width:10px; height:10px; border-radius:50%; margin-top:6px; background:var(--bad); }
.dot.amber{ background:var(--amber); } .dot.grey{ background:var(--flat); }
.alert-li .tt{ font-weight:600; font-size:14.5px; }
.tags{ display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; align-items:center; }
.tag{ border-radius:999px; padding:2px 10px; font-size:12.5px; font-weight:600; background:var(--grey-card); color:var(--ink); border:1px solid var(--line); }
.tag.open{ background:var(--bad-soft); color:var(--bad); border-color:transparent; }
.tag.ack{ background:var(--amber-soft); color:var(--amber); border-color:transparent; }
.tag.closed{ background:var(--good-soft); color:var(--good); border-color:transparent; }
.tag.rev{ background:var(--accent-soft); color:var(--accent-ink); border-color:transparent; }
.imp{ text-align:right; } .imp b{ display:block; font-size:16px; color:var(--bad); } .imp span{ color:var(--mute); font-size:12.5px; }
/* drawer */
.drawer{ position:fixed; top:0; right:0; bottom:0; width:min(480px,100%); background:var(--card); border-left:1px solid var(--line); z-index:50; transform:translateX(102%); transition:transform .22s ease; display:flex; flex-direction:column; box-shadow:-10px 0 40px rgba(20,22,60,.12); }
.drawer.open{ transform:none; }
.drawer-h{ padding:calc(18px + env(safe-area-inset-top,0px)) 22px 14px; border-bottom:1px solid var(--line-2); display:flex; gap:10px; align-items:flex-start; }
.drawer-h h3{ margin:0; font-size:19px; }
.drawer-h .x{ margin-left:auto; border:0; background:var(--grey-card); width:32px; height:32px; border-radius:8px; font-size:18px; flex:none; }
.drawer-b{ overflow:auto; padding:18px 22px calc(30px + env(safe-area-inset-bottom,0px)); }
.dl{ display:grid; grid-template-columns:110px 1fr; gap:6px 12px; font-size:13.5px; margin:12px 0; }
.dl dt{ color:var(--mute); } .dl dd{ margin:0; }
.bigv{ font-size:32px; font-weight:600; letter-spacing:-.02em; }
.h4{ font-weight:600; font-size:13.5px; margin:20px 0 8px; color:var(--ink); }
.read{ background:var(--accent-soft); color:var(--ink); border-radius:10px; padding:12px 14px; font-size:14px; }
.read b{ color:var(--accent-ink); }
table.t{ width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums; }
table.t th{ text-align:right; color:var(--mute); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
table.t th:first-child, table.t td:first-child{ text-align:left; }
table.t td{ text-align:right; padding:7px 8px; border-bottom:1px solid var(--line-2); }
table.t tr.click{ cursor:pointer; } table.t tr.click:hover td{ background:var(--grey-card); }
table.t tr.total td{ font-weight:600; border-top:1px solid var(--line); }
.tw{ overflow-x:auto; }
.splits{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.splits button{ border:1px solid var(--line); background:var(--card); border-radius:999px; padding:4px 12px; font-size:12.5px; }
.splits button.on{ background:var(--ink); color:var(--card); border-color:var(--ink); }
.scrim{ position:fixed; inset:0; background:rgba(16,18,40,.28); z-index:40; display:none; }
.scrim.on{ display:block; }
/* generic page headings */
.ph{ margin:2px 0 18px; } .ph h2{ font-size:30px; margin:0 0 6px; font-weight:600; letter-spacing:-.02em; } .ph p{ color:var(--mute); margin:0; max-width:760px; font-size:15.5px; }
/* scenarios */
.presets{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; margin-bottom:18px; }
.preset{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; text-align:left; }
.preset:hover{ border-color:var(--accent); }
.preset.on{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.preset b{ display:block; font-size:16px; margin-bottom:6px; } .preset span{ color:var(--mute); font-size:13.5px; }
.sc-grid{ display:grid; grid-template-columns:minmax(300px,1fr) 1.3fr; gap:16px; }
.lever{ padding:12px 0; border-bottom:1px solid var(--line-2); }
.lever:last-child{ border-bottom:0; }
.lever .lh{ display:flex; justify-content:space-between; gap:10px; font-weight:600; font-size:14px; }
.lever .lh span{ color:var(--accent-ink); font-variant-numeric:tabular-nums; }
.lever p{ margin:2px 0 6px; color:var(--mute); font-size:12.5px; }
.lever input{ width:100%; accent-color:var(--accent); }
.res-cards{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
.res{ border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
.res .t{ color:var(--mute); font-size:13.5px; } .res .v{ font-size:24px; font-weight:600; letter-spacing:-.01em; } .res .d{ font-size:13px; font-weight:600; }
.deck-note{ font-size:13px; color:var(--mute); margin-top:12px; }
/* reports */
.rp-top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.rp-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
.rp{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 22px; text-align:left; display:flex; flex-direction:column; }
.rp:hover{ border-color:var(--accent); }
.rp .id{ color:var(--mute); font-weight:600; font-size:13px; display:flex; justify-content:space-between; align-items:center; }
.rp h4{ font-size:19px; margin:10px 0 6px; font-weight:600; } .rp p{ color:var(--mute); margin:0 0 14px; font-size:14px; }
.rp dl{ display:grid; grid-template-columns:1fr 1fr; gap:4px 16px; border-top:1px solid var(--line-2); padding-top:12px; margin:auto 0 0; font-size:13.5px; }
.rp dt{ color:var(--mute); } .rp dd{ margin:0 0 6px; }
.modal{ position:fixed; inset:0; z-index:60; display:none; align-items:flex-start; justify-content:center; padding:calc(30px + env(safe-area-inset-top,0px)) 16px 30px; overflow:auto; background:rgba(16,18,40,.35); }
.modal.on{ display:flex; }
.sheet{ background:var(--card); border-radius:14px; width:min(980px,100%); padding:26px 30px; position:relative; }
.sheet .x{ position:absolute; right:16px; top:16px; border:0; background:var(--grey-card); width:34px; height:34px; border-radius:8px; font-size:18px; }
.sheet h3{ font-size:22px; margin:0 0 4px; } .sheet .sub{ color:var(--mute); margin-bottom:18px; }
.mini-kpis{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:18px; }
.mini-kpis div{ border:1px solid var(--line); border-radius:10px; padding:10px 12px; } .mini-kpis span{ color:var(--mute); font-size:12.5px; display:block; } .mini-kpis b{ font-size:19px; }
/* ask */
.ask{ max-width:980px; margin:0 auto; }
.qs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; margin:12px 0 24px; }
.qs button{ text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; font-size:15px; }

<script>
// ===== Horizon value tree engine (pure JS, no DOM) =====
const MONTHS = [];
(function(){ const names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let y=2025,m=4; for(let i=0;i<24;i++){ MONTHS.push({key:`${y}-${String(m).padStart(2,'0')}`,label:`${names[m-1]} ${y}`,i}); m++; if(m>12){m=1;y++;} } })();
const LAST_ACTUAL = 17; // Sep 2026
const FY_START = 12;    // Apr 2026

const REGIONS = ['NCR','Pune','Nagpur','Ahmedabad','Bengaluru','Hyderabad','Chennai','Goa','InCity network','Other parks'];
const FORMATS = [{k:'fc',l:'Fulfilment centres'},{k:'ind',l:'Industrial'},{k:'city',l:'InCity centres'}];
const SEGMENTS = [
  {k:'ecom',l:'E-commerce',f:'fc',w:19.2},{k:'logc',l:'Consumer logistics',f:'fc',w:19.2},{k:'retail',l:'Retail',f:'fc',w:11.0},{k:'logi',l:'Industrial logistics',f:'fc',w:2.5},
  {k:'ev',l:'EV and auto',f:'ind',w:12.5},{k:'ren',l:'Renewables',f:'ind',w:9.8},{k:'mfg',l:'Manufacturing and other',f:'ind',w:25.9}
];
// Parks: completed M sq ft (Sep 2026), committed occupancy, rent Rs/sqft/month, FC share, region, start factor, budget-actual quirks
const PARKS = [
 {k:'fn1',l:'Farukhnagar I',r:'NCR',a:3.2,o:.90,rent:25.4,fc:.74,real:.962,np:.05,opx:.21},
 {k:'fn2',l:'Farukhnagar II',r:'NCR',a:2.2,o:1.0,rent:22.5,fc:1,real:.996,np:.02,opx:.19},
 {k:'luh',l:'Luhari',r:'NCR',a:3.3,o:.85,rent:22.3,fc:.85,real:.968,np:.06,opx:.22},
 {k:'bil',l:'Bilaspur',r:'NCR',a:2.1,o:1.0,rent:29.5,fc:.64,real:.995,np:.12,opx:.2,late:.18,lateDays:54},
 {k:'chk',l:'Chakan II',r:'Pune',a:1.4,o:1.0,rent:32.5,fc:1,real:.997,np:.02,opx:.2},
 {k:'xsio',l:'XSIO Park One',r:'Nagpur',a:2.6,o:1.0,rent:21.6,fc:.95,real:.995,np:.18,opx:.18},
 {k:'bhy',l:'Bhayala',r:'Ahmedabad',a:.5,o:1.0,rent:24.0,fc:0,real:.998,np:.0,opx:.17,young:true},
 {k:'dob',l:'Dobbaspet I',r:'Bengaluru',a:1.8,o:1.0,rent:24.6,fc:0,real:.996,np:.38,opx:.2,young:true,late:.22,lateDays:71},
 {k:'mal',l:'Malur',r:'Bengaluru',a:1.7,o:1.0,rent:25.1,fc:1,real:.996,np:.02,opx:.19},
 {k:'hos',l:'Hosur',r:'Bengaluru',a:1.0,o:.85,rent:36.9,fc:.16,real:.995,np:.26,opx:.22,young:true},
 {k:'kot',l:'Kothur',r:'Hyderabad',a:1.1,o:1.0,rent:23.8,fc:.87,real:.996,np:.03,opx:.19},
 {k:'pat',l:'Patancheru',r:'Hyderabad',a:.6,o:1.0,rent:23.3,fc:.71,real:.997,np:.0,opx:.19},
 {k:'ora',l:'Oragadam',r:'Chennai',a:3.7,o:1.0,rent:27.7,fc:.0,real:.995,np:.14,opx:.2,late:.25,lateDays:38},
 {k:'map',l:'Mappedu',r:'Chennai',a:1.3,o:.77,rent:23.3,fc:.86,real:.976,np:.04,opx:.23},
 {k:'ver',l:'InCity Verna',r:'Goa',a:.1,o:1.0,rent:27.2,city:true,real:.996,np:0,opx:.24},
 {k:'icn',l:'InCity, 6 cities',r:'InCity network',a:1.15,o:.82,rent:46.0,city:true,real:.985,np:.12,opx:.3,young:true},
 {k:'oth',l:'Other parks (29)',r:'Other parks',a:1.55,o:.95,rent:24.5,fc:.6,real:.99,np:.05,opx:.21},
];
const PARK_BY = Object.fromEntries(PARKS.map(p=>[p.k,p]));

// deterministic noise
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return ((h>>>0)%10000)/10000;}
function noise(s,amp){return (hash(s)-.5)*2*amp;}

// ----- build rows -----
const ROWS=[]; // row grain: park x format x segment
for(const p of PARKS){
  const parts=[];
  if(p.city){ parts.push({f:'city',seg:'ecom',w:.55},{f:'city',seg:'logc',w:.3},{f:'city',seg:'retail',w:.15}); }
  else {
    const fcSegs=SEGMENTS.filter(s=>s.f==='fc'), indSegs=SEGMENTS.filter(s=>s.f==='ind');
    const fw=fcSegs.reduce((a,s)=>a+s.w*(.6+hash(p.k+s.k)),0), iw=indSegs.reduce((a,s)=>a+s.w*(.6+hash(p.k+s.k)),0);
    if(p.fc>0) fcSegs.forEach(s=>parts.push({f:'fc',seg:s.k,w:p.fc*s.w*(.6+hash(p.k+s.k))/fw}));
    if(p.fc<1) indSegs.forEach(s=>parts.push({f:'ind',seg:s.k,w:(1-p.fc)*s.w*(.6+hash(p.k+s.k))/iw}));
  }
  for(const pt of parts){ ROWS.push({id:p.k+'|'+pt.f+'|'+pt.seg,park:p.k,region:p.r,format:pt.f,seg:pt.seg,w:pt.w}); }
}

// growth curve: area factor by month index (actual); young parks ramp faster
function areaF(p,t){ const base = p.young? 0.55 : 0.84; if(t<=LAST_ACTUAL) return base+(1-base)*Math.pow(t/LAST_ACTUAL,1.1); return 1+0.011*(t-LAST_ACTUAL); }
function rentF(t){ return Math.pow(1.048,(t-LAST_ACTUAL)/12); }

// ----- data store -----
// D.row[ver][t][rowId] = {comp,occ,np,rent,real,svc}
// D.park[ver][t][park] = {opex,capex,opAssets,cwip,planYTD,delYTD,daysLate,rentB}
// D.co[ver][t] = {oi,emp,oexp,da,fin,tax,taxPaid,dd,netDebt,shares}
const D={row:{actual:[],budget:[]},park:{actual:[],budget:[]},co:{actual:[],budget:[]}};
for(const ver of ['actual','budget']){
  for(let t=0;t<24;t++){
    if(ver==='actual' && t>LAST_ACTUAL){ D.row[ver][t]=null; D.park[ver][t]=null; D.co[ver][t]=null; continue; }
    const rows={}, parks={};
    let totRev=0, totComp=0;
    for(const p of PARKS){
      const af=areaF(p,t);
      const b = ver==='budget';
      const pk={};
      // occupancy: actual drifts, budget a bit higher at weak parks
      let occ = p.o + noise(p.k+t+'o',.012);
      if(b) occ = Math.min(1, p.o<.95? p.o+.02 : p.o+.002);
      occ=Math.min(1,occ);
      // lease-up lag: area leased but not paying
      let npShare = p.np*.8*(1+noise(p.k+t+'n',.2));
      if(b) npShare = p.np*.62;
      if(t<FY_START && b) npShare=p.np*.55;
      let real = b? .997 : Math.min(.999,p.real+noise(p.k+t+'r',.004));
      const rent = 1.028*p.rent*rentF(t)*(b? (1+ (p.k==='icn'? .03:.004)) : 1)*(1+noise(p.k+t+'p',.003));
      // late deliveries: budget area includes the late blocks from Jul 2026
      let comp = p.a*af;
      if(!b && p.late && t>=15) comp -= p.late*(t>=16?1:.5);
      if(b && p.late && t>=15 && t<FY_START+12) {/* budget has them on time */}
      if(b && t>LAST_ACTUAL) comp = p.a*areaF(p,t);
      let pRev=0;
      for(const r of ROWS.filter(r=>r.park===p.k)){
        const c=comp*r.w;
        const rowRent = rent*(1+noise(r.id+'rr',.06))*(r.format==='ind'?1.04:1);
        const v={comp:c,occ,np:c*occ*npShare,rent:rowRent,real,svc:1.05*(r.format==='city'?1.6:1)};
        rows[r.id]=v;
        const billed=c*occ-v.np; pRev+= (billed*rowRent*real + billed*v.svc)/10;
      }
      totRev+=pRev; totComp+=comp;
      pk.opex = comp*p.opx*(b? .97:1)*(1+noise(p.k+t+'x',.05));
      const planAnnual = ['bil','dob','ora','hos','icn','xsio','oth'].includes(p.k)? p.a*.18 : 0;
      const ytdM = t>=FY_START? (t-FY_START+1) : 0;
      pk.planYTD = planAnnual*ytdM/12;
      pk.delYTD = Math.max(0, pk.planYTD - (!b && p.late && t>=15 ? p.late*(t>=16?1:.5) : 0));
      pk.daysLate = (!b && p.late && t>=15)? p.lateDays*(t>=16?1:.6) : 0;
      pk.rentB = 1.028*p.rent*rentF(t);
      pk.capex = (planAnnual>0? planAnnual*1.6*210/12 : 1.5) * (b?1: (p.late? .82 : .97)) * (1+noise(p.k+t+'c',.08));
      pk.opAssets = comp*365; // Rs cr per M sqft at cost
      pk.cwip = (planAnnual*2.2+ (p.young? .4:0))*210*(b?.97:1);
      parks[p.k]=pk;
    }
    const co={};
    co.oi = (t>=FY_START? 1.6 : 6.4) + noise('oi'+t+ver,.25) + (ver==='budget'? -.15:0);
    co.emp = 2.2 + t*.04 + (ver==='budget'?-.05:0);
    co.oexp = 5.0 + t*.03 + noise('ox'+t+ver,.3) + (ver==='budget'?-.35:0);
    co.da = 18.5 + t*.4 + (ver==='budget'?-.2:0);
    co.fin = t<FY_START? 47 - t*.3 : 34.4 - (t-FY_START)*.3 + noise('fin'+t,.4) + (ver==='budget'?-.5:0);
    co.dd = ver==='budget'? 60 : 62 + Math.max(0,t-12)*2 + noise('dd'+t,1.5);
    co.netDebt = t<FY_START? 6100 - t*40 : 2440 + (t-FY_START)*28 + (ver==='budget'? -95:0);
    co.shares = t<FY_START? 168 : 200; // crore shares (illustrative)
    D.row[ver][t]=rows; D.park[ver][t]=parks; D.co[ver][t]=co;
  }
}
// tax: small, set after EBITDA known (computed in engine as share of positive PBT plus minimum)

// ----- lens & aggregation -----
// lens = {format, region, park, seg} values or null
function rowMatch(r,L){ return (!L.format||r.format===L.format)&&(!L.region||r.region===L.region)&&(!L.park||r.park===L.park)&&(!L.seg||r.seg===L.seg); }
function parkMatch(pk,L){ const p=PARK_BY[pk]; return (!L.region||p.r===L.region)&&(!L.park||p.k===L.park); }
function lensLevel(L){ // which grains are valid
  const rowOnly = !!(L.format||L.seg);
  const anyGeo = !!(L.region||L.park);
  return { row:true, park: !rowOnly, co: !rowOnly && !anyGeo };
}

// scenario transform hooks: sc = {lag, bill, rent, occ, late, rate}
function getRow(ver,t,r,sc){ const v=D.row[ver][t]&&D.row[ver][t][r.id]; if(!v) return null; if(!sc||ver!=='actual') return v;
  const o={...v}; const p=PARK_BY[r.park];
  if(sc.lag) o.np = v.np*(1-sc.lag);
  if(sc.bill) o.real = Math.min(.999, v.real + sc.bill);
  if(sc.rent) o.rent = v.rent*(1+sc.rent);
  if(sc.occ) o.occ = Math.min(1, v.occ + sc.occ);
  if(sc.late && p.late && t>=15) { o.comp += p.late*(t>=16?1:.5)*sc.late*r.w; }
  return o; }

function aggregate(L,t,ver,sc){
  const lv=lensLevel(L);
  const S={valid:lv, comp:0,leased:0,np:0,billed:0,owed:0,rental:0,svc:0};
  if(!D.row[ver][t]) return null;
  for(const r of ROWS){ if(!rowMatch(r,L)) continue; const v=getRow(ver,t,r,sc);
    const leased=v.comp*v.occ, billed=leased-v.np, owed=billed*v.rent/10;
    S.comp+=v.comp; S.leased+=leased; S.np+=v.np; S.billed+=billed; S.owed+=owed; S.rental+=owed*v.real; S.svc+=billed*v.svc/10; }
  S.rev=S.rental+S.svc; S.occ=S.comp? S.leased/S.comp:null; S.rent=S.billed? S.owed*10/S.billed:null; S.real=S.owed? S.rental/S.owed:null;
  S.lagMonths = S.billed? S.np/ ( (S.comp*0.012) || 1 ) : null; // not used
  if(lv.park){ let opex=0,capex=0,opA=0,cwip=0,plan=0,del=0,late=0,lost=0,dlw=0;
    for(const pk of PARKS){ if(!parkMatch(pk.k,L)) continue; const x=D.park[ver][t][pk.k];
      let lateA=Math.max(0,x.planYTD-x.delYTD); if(sc&&sc.late&&ver==='actual') lateA*= (1-sc.late);
      opex+=x.opex; capex+=x.capex; opA+=x.opAssets; cwip+=x.cwip; plan+=x.planYTD; del+=x.planYTD-lateA; late+=lateA; lost+=lateA*x.rentB/10; dlw+=x.daysLate*lateA; }
    Object.assign(S,{popex:opex,noi:S.rev-opex,capex,opA,cwip,planYTD:plan,delYTD:del,lateA:late,rentLost:lost,daysLate: late? dlw/late:0, yoc: opA? (S.rev-opex)*12/opA:null}); }
  if(lv.co){ const c=D.co[ver][t]; let fin=c.fin; if(sc&&sc.rate&&ver==='actual') fin = c.fin*(1+sc.rate/820);
    S.oi=c.oi; S.emp=c.emp; S.oexp=c.oexp; S.ovh=c.emp+c.oexp; S.ebitda=S.noi+S.oi-S.ovh; S.da=c.da; S.fin=fin;
    S.pbt=S.ebitda-S.da-S.fin; S.tax=0.35+Math.max(0,S.pbt)*.12; S.pat=S.pbt-S.tax; S.margin=S.rev? S.ebitda/S.rev:null;
    S.dd=c.dd; const prevC = t>0? (D.co[ver][t-1]||D.co.actual[t-1]) : c;
    const prevRev = t>0? aggSimpleRev(t-1,ver):S.rev;
    S.wc = c.dd/30*S.rev; S.wcPrev = prevC.dd/30*prevRev; S.wcChg=S.wc-S.wcPrev;
    if(sc){ S.wcChg = c.dd/30*aggSimpleRev(t,ver) - S.wcPrev; }
    S.taxPaid=S.tax; S.cfo=S.ebitda-S.taxPaid-S.wcChg; S.intPaid=S.fin; S.fcf=S.cfo-S.capex-S.intPaid;
    S.netDebt=c.netDebt; S.shares=c.shares;
    S.ebitAnn=(S.ebitda-S.da)*12; S.capEmp=S.opA+S.cwip+S.wc; S.roce=S.capEmp? S.ebitAnn/S.capEmp:null;
    S.icov = S.fin? S.ebitda/S.fin:null; }
  return S; }
const _revCache={};
function aggSimpleRev(t,ver){ const k=t+ver; if(_revCache[k]!=null) return _revCache[k]; let rev=0; const src=D.row[ver][t]||D.row.actual[t]; if(!src) return 0;
  for(const r of ROWS){ const v=src[r.id]; const b=v.comp*v.occ-v.np; rev+=(b*v.rent*v.real+b*v.svc)/10; } return _revCache[k]=rev; }

// LTM sums
function ltm(L,t,ver,key,sc){ let s=0; for(let i=t-11;i<=t;i++){ const S=aggregate(L,i,ver,i===t?sc:null); if(!S||S[key]==null) return null; s+=S[key]; } return s; }


</script>
<script>
// ===== UI =====
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MINUS='\u2212';
function rs(v,dp){ if(v==null||!isFinite(v)) return '–'; return (v<0?MINUS:'')+'₹'+num(Math.abs(v),dp); }
const PARK_L=Object.fromEntries(PARKS.map(p=>[p.k,p.l]));
const FMT_L=Object.fromEntries(FORMATS.map(f=>[f.k,f.l]));
const SEG_L=Object.fromEntries(SEGMENTS.map(s=>[s.k,s.l]));
SEG_L.ecom='E-commerce';

const state={ view:'tree', t:LAST_ACTUAL, cmp:'budget', L:{format:null,region:null,park:null,seg:null}, tab:'pat',
  collapsed:{billed:true, ovh:true}, zoom:{}, sel:null, bridgeOpen:{}, alertSel:null, alertFilter:'all', alertTab:'feed',
  sc:{lag:0,bill:0,rent:0,occ:0,late:0,rate:0}, preset:null, treeSc:null, convo:[], rpFilter:'all' };

// ---------- values ----------
const cache=new Map();
function vals(L,t,ver,sc){ if(t<0) return null; const key=JSON.stringify([L,t,ver,sc||0]); if(cache.has(key)) return cache.get(key);
  const S=aggregate(L,t,ver,sc); if(S && S.valid.co){ const pl=t>=11? ltm(L,t,ver,'pat',sc):null, el=t>=11? ltm(L,t,ver,'ebitda',sc):null;
    S.patLTM=pl; S.ebitdaLTM=el; S.eps= pl!=null? pl/S.shares : null; S.nde = el? S.netDebt/el : null; }
  if(S && S.valid.park){ S.rentLate = S.lateA? S.rentLost*10/S.lateA : null; }
  cache.set(key,S); return S; }
function cmpOf(L,t,mode,sc){ mode=mode||state.cmp; if(mode==='budget') return vals(L,t,'budget'); if(mode==='ly') return t>=12? vals(L,t-12,'actual'):null; return t>=1? vals(L,t-1,'actual'):null; }
const CMP_L={budget:'Budget',ly:'Last year',lm:'Last month'};
function curS(){ return vals(state.L,state.t,'actual',state.treeSc); }
function cmpS(){ return state.treeSc? vals(state.L,state.t,'actual') : cmpOf(state.L,state.t); }
function cmpLabel(){ return state.treeSc? 'Base' : CMP_L[state.cmp]; }

// ---------- formatting ----------
function num(v,dp){ if(v==null||!isFinite(v)) return '–'; const s=Math.abs(v).toLocaleString('en-IN',{minimumFractionDigits:dp,maximumFractionDigits:dp}); return (v<0?MINUS:'')+s; }
function fv(u,v){ if(v==null||!isFinite(v)) return {m:'–',s:''};
  switch(u){ case 'cr': return {m:num(v,1),s:'Cr'}; case 'msf': return {m:num(v,2),s:'M sq ft'}; case 'psf': return {m:'Rs '+num(v,1),s:'/sq ft'};
   case 'pct': return {m:num(v*100,1)+'%',s:''}; case 'days': return {m:num(v,0),s:'days'}; case 'x': return {m:num(v,2)+'x',s:''}; case 'rs': return {m:'Rs '+num(v,2),s:''}; case 'crn': return {m:num(v,0),s:'Cr'}; }
  return {m:num(v,1),s:''}; }
function fvs(u,v){ const x=fv(u,v); return x.s && x.s!=='Cr'? x.m+' '+x.s.replace(/^\//,'per '): x.m+(x.s==='Cr'?' Cr':''); }
function delta(u,a,b,dir){ if(a==null||b==null||!isFinite(a)||!isFinite(b)) return {txt:'',cls:'flat'};
  const d=a-b; let txt;
  if(u==='pct'){ txt=(d>=0?'+':MINUS)+num(Math.abs(d*100),1)+' pts'; }
  else { const dp = u==='msf'||u==='x'||u==='rs'? 2 : (u==='days'||u==='crn'?0:1); const abs=(d>=0?'+':MINUS)+num(Math.abs(d),dp).replace(MINUS,'');
    let pc; if(Math.abs(b)<1e-9 || (a<0)!==(b<0) || b<0) pc='n.m.'; else pc=(d>=0?'+':MINUS)+num(Math.abs(d/b*100),1)+'%'; txt=abs+' '+pc; }
  const rel = u==='pct'? Math.abs(d)/0.1 : Math.abs(d)/Math.max(Math.abs(b),1e-9);
  const flatLim = u==='pct'? 0.003/0.1 : 0.03;
  const cls = rel<flatLim? 'flat' : (d*dir>0?'good':'bad');
  return {txt,cls,d}; }

// ---------- KPI strip ----------
function spark(fn){ const pts=[]; for(let i=Math.max(0,state.t-11);i<=state.t;i++){ const S=vals(state.L,i,'actual'); const v=S?fn(S):null; if(v!=null&&isFinite(v)) pts.push(v); }
  if(pts.length<2) return ''; const mn=Math.min(...pts),mx=Math.max(...pts),r=mx-mn||1; const w=86,h=30;
  const d=pts.map((v,i)=>`${(i/(pts.length-1)*w).toFixed(1)},${(h-(v-mn)/r*h+2).toFixed(1)}`).join(' ');
  const last=d.split(' ').pop().split(',');
  return `<svg viewBox="0 0 ${w} ${h+4}" aria-hidden="true"><polyline points="${d}" fill="none" stroke="var(--ink)" stroke-width="1.6"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="var(--ink)"/></svg>`; }
function renderKPIs(){ const S=curS(), C=cmpS(); const lv=S.valid;
  const K=[['rev','Revenue',S=>S.rev,'row'],['margin','EBITDA margin',S=>S.margin,'co','pct',1],['pat','PAT',S=>S.pat,'co'],['occ','Committed occupancy',S=>S.occ,'row'],['rent','Rent per sq ft',S=>S.rent,'row'],['real','Share of rent billed',S=>S.real,'row']];
  return `<div class="kpis">${K.map(([id,l,fn,g,u0,dir0])=>{ const ok = g==='row'||lv.co; const n=N[id]||{}; const u=u0||n.u, dir=dir0||n.dir;
    if(!ok) return `<div class="kpi na"><div class="t">${l}</div><div class="v">Company only</div><div class="c">Clear the filter to see it</div></div>`;
    const a=fn(S), b=C?fn(C):null; const dl=delta(u,a,b,dir); const x=fv(u,a);
    return `<button class="kpi ${dl.cls}" data-node="${N[id]?id:'ebitda'}"><div class="t">${l}</div><div class="v">${x.m}${x.s&&u!=='pct'?`<small style="font-size:14px;color:var(--mute);font-weight:500"> ${x.s==='Cr'?'Cr':x.s}</small>`:''}</div><div class="c">${cmpLabel()} ${b!=null?fv(u,b).m:'–'}</div><div class="d ${dl.cls}-t">${dl.txt.split(' ')[0]||''}</div>${spark(fn)}</button>`; }).join('')}</div>`; }

// ---------- tree layout & render ----------
const W=196,H=94,CG=46,RG=14;
function countDesc(def,id){ const c=def.ch[id]||[]; return c.reduce((a,[k])=>a+1+countDesc(def,k),0); }
function layoutTree(def){ const nodes=[], edges=[], labels=[]; let y=0; let maxD=0;
  function place(id,d,op,parent){ const kids=(def.ch[id]||[]); const col=state.collapsed[id]; const n={id,d,x:d*(W+CG),op,parent,kids:kids.length,collapsed:!!col};
    maxD=Math.max(maxD,d); nodes.push(n);

function rowV(r,t,ver,sc){ const v=getRow(ver,t,r,sc); if(!v) return null; const leased=v.comp*v.occ, billed=leased-v.np; return {...v,leased,billed}; }
function bridge(L,t,mode,sc){ // returns steps from comparison to actual
  const lv=lensLevel(L); const A={t,ver:'actual',sc}; let B;
  if(sc) B={t,ver:'actual',sc:null}; else if(mode==='budget') B={t,ver:'budget'}; else if(mode==='ly'){ if(t<12) return null; B={t:t-12,ver:'actual'}; } else { if(t<1) return null; B={t:t-1,ver:'actual'}; }
  const keys=['area','occ','lag','rent','bill','svc']; const steps={}; keys.forEach(k=>steps[k]={v:0,by:{}});
  const add=(k,p,v)=>{ steps[k].v+=v; steps[k].by[p]=(steps[k].by[p]||0)+v; };
  for(const r of ROWS){ if(!rowMatch(r,L)) continue; const a=rowV(r,A.t,A.ver,A.sc), b=rowV(r,B.t,B.ver,B.sc); if(!a||!b) continue;
    const kB=(b.rent*b.real+b.svc)/10;
    add('area',r.park,(a.comp-b.comp)*b.occ*kB); add('occ',r.park,a.comp*(a.occ-b.occ)*kB); add('lag',r.park,-(a.np-b.np)*kB);
    add('rent',r.park,a.billed*(a.rent-b.rent)*b.real/10); add('bill',r.park,a.billed*a.rent*(a.real-b.real)/10); add('svc',r.park,a.billed*(a.svc-b.svc)/10); }

  const lab={area:'Finished space',occ:'Occupancy',lag:'Leased, not yet paying',rent:'Rent per sq ft',bill:'Rent billed vs owed',svc:'Services income'};
  const out=keys.map(k=>({k,l:lab[k],v:steps[k].v,by:steps[k].by}));
  let metric='Revenue', a=SA.rev, b=SB.rev;
  if(lv.park){ const by={}; for(const p of PARKS){ if(!parkMatch(p.k,L)) continue; by[p.k]=-(D.park.actual[A.t][p.k].opex-(D.park[B.ver][B.t][p.k].opex)); }

  const dims=splitDims(meta);
  if(valid && dims.length){ if(!dims.find(d=>d[0]===splitDim)) splitDim=dims[0][0];
    const vs=dimValues(splitDim); const additive=['cr','msf'].includes(meta.u);
    let rows=vs.map(([k,l])=>{ const L2={...state.L,[splitDim]:k}; if(splitDim==='park') L2.region=PARK_BY[k].r; const a=vals(L2,state.t,'actual',state.treeSc); if(!a||a.comp<1e-6) return null; const b=state.treeSc? vals(L2,state.t,'actual') : cmpOf(L2,state.t); const av=meta.v(a), bv=b?meta.v(b):null; const dl=delta(meta.u,av,bv,meta.dir); return {k,l,av,bv,dl}; }).filter(Boolean);
    rows.sort((x,y)=> additive? Math.abs(y.av)-Math.abs(x.av) : y.av-x.av);
    h+=`<div class="h4">Split</div><div class="splits">${dims.map(([k,l])=>`<button data-sd="${k}" class="${k===splitDim?'on':''}">${l}</button>`).join('')}</div>
     <div class="tw"><table class="t"><thead><tr><th>${dims.find(d=>d[0]===splitDim)[1]}</th><th>Actual</th><th>${cmpLabel()}</th><th>Change</th></tr></thead><tbody>${rows.map(r=>`<tr class="click" data-lk="${r.k}"><td>${esc(r.l)}</td><td>${fv(meta.u,r.av).m}</td><td>${r.bv!=null?fv(meta.u,r.bv).m:'–'}</td><td><span class="dchip ${r.dl.cls}">${r.dl.txt.split(' ')[0]||'–'}</span></td></tr>`).join('')}
     ${additive?`<tr class="total"><td>Total</td><td>${fv(meta.u,meta.v(S)).m}</td><td>${C?fv(meta.u,meta.v(C)).m:'–'}</td><td></td></tr>`:''}</tbody></table></div><div style="color:var(--mute);font-size:12.5px;margin-top:6px">${additive?'Parts add up to the total.':'Ratios are worked out from each part’s own totals, so they do not add up.'} Click a row to filter the whole tree.</div>`; }
  $('#dBody').innerHTML=h; $('#drawer').classList.add('open'); $('#scrim').classList.add('on');
  $('#dBody').querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>{ splitDim=b.dataset.sd; openNode(id); });

function readFor(id,meta,S,C){ if(!C) return 'No comparison figures for this month.';
  const a=meta.v(S), b=meta.v(C); const dl=delta(meta.u,a,b,meta.dir); const word = dl.cls==='flat'? 'In line with' : (dl.cls==='good'?'Better than':'Worse than');
  let s=`<b>${word} ${cmpLabel().toLowerCase()}</b> (${dl.txt||'no change'}). `;
  if(['ebitda','pat','pbt'].includes(id) && S.valid.co){ const br=bridge(state.L,state.t,state.cmp,state.treeSc); if(br){ const top=br.steps.slice().sort((x,y)=>Math.abs(y.v)-Math.abs(x.v)).slice(0,3); s+=`Biggest moves in EBITDA: ${top.map(x=>`${x.l.toLowerCase()} ${x.v>=0?'+':MINUS}${num(Math.abs(x.v),1)}`).join(', ')}.`; if(id!=='ebitda') s+=` Depreciation and interest add ${num(-((S.da+S.fin)-(C.da+C.fin)),1)}.`; } return s; }
  const dims=splitDims(meta); if(!dims.length) return s+'Company-level number, so there is no split below it.';
  let by; if(!state.L.park) by=PARKS.filter(p=>parkMatch(p.k,state.L)).map(p=>({l:p.l,L2:{...state.L,park:p.k,region:p.r}}));
  else if(meta.g==='row') by=SEGMENTS.filter(x=>!state.L.seg||x.k===state.L.seg).map(x=>({l:x.l,L2:{...state.L,seg:x.k}}));
  else return s+'One park is selected, so there is nothing further to split.';
  const parts=by.map(o=>{ const x=vals(o.L2,state.t,'actual',state.treeSc), y=state.treeSc?vals(o.L2,state.t,'actual'):cmpOf(o.L2,state.t); if(!x||!y||x.comp<1e-6) return null; return {l:o.l,d:meta.v(x)-meta.v(y),a:meta.v(x)}; }).filter(Boolean);
  if(['cr','msf'].includes(meta.u)){ parts.sort((x,y)=>(x.d*meta.dir)-(y.d*meta.dir)); const worst=parts.slice(0,3).filter(x=>x.d*meta.dir<0);
    if(worst.length) s+=`Largest drags: ${worst.map(x=>`${x.l} ${x.d>=0?'+':MINUS}${num(Math.abs(x.d),2)}`).join(', ')}.`; else s+='Nothing is behind.'; }
  else { parts.sort((x,y)=>(x.a*meta.dir)-(y.a*meta.dir)); s+=`Weakest: ${parts.slice(0,3).map(x=>`${x.l} ${fv(meta.u,x.a).m}`).join(', ')}.`; }
  return s; }

  else if(r.r==='deliv'){ const rows=PARKS.map(p=>({p,a:vals({park:p.k},t,'actual')})).filter(x=>x.a.planYTD>0);
    body=tableHTML(['Park','Planned YTD','Finished YTD','Running late','Days late','Rent lost, ₹ cr a month','Spend vs budget'],rows.map(({p,a})=>{ const b=vals({park:p.k},t,'budget'); return [p.l,num(a.planYTD,2),num(a.delYTD,2),num(a.lateA,2),num(a.daysLate,0),num(a.rentLost,2),d('cr',a.capex,b.capex,1)]; }),['Total',num(S.planYTD,2),num(S.delYTD,2),num(S.lateA,2),num(S.daysLate,0),num(S.rentLost,2),'']); }
  else if(r.r==='cash'){ const ids=['ebitda','tax','wcChg','cfo','capex','fin','fcf','netDebt','dd','icov','nde','eps'];
    body=tableHTML(['','Actual','Budget','vs budget'],ids.map(id=>{ const m=N[id]; return [id==='fin'?'Interest paid':id==='tax'?'Tax paid':m.l,fv(m.u,m.v(S)).m,fv(m.u,m.v(B)).m,d(m.u,m.v(S),m.v(B),m.dir)]; })); }
  $('#sheet').innerHTML=`<button class="x" id="mClose" aria-label="Close">×</button><div style="color:var(--mute);font-weight:600">${r.id}</div><h3>${r.l}</h3><div class="sub">${MONTHS[t].label}, whole company. Goes to ${r.to}. ${r.when}.</div>${body}`;
  $('#modal').classList.add('on'); $('#mClose').onclick=()=>$('#modal').classList.remove('on'); }
function bindRp(){ const p=$('#page'); p.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{ state.rpFilter=b.dataset.rf; renderPage(); });
  p.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>renderReport(REPORTS.find(r=>r.id===b.dataset.rp))); }

// ask
const QUESTIONS=['Why did PAT miss budget this month?','Which parks hurt revenue most?','How much rent did we not bill?','How much leased space is not paying yet?','Where did the cash go this month?','How is Oragadam doing?','What is going well?','How are we doing against last year?','When does Horizon turn a profit?'];
const chip=(id,l)=>`<span class="ref-chip" data-on="${id}">${esc(l||N[id].l)}</span>`;
function answer(q){ const t=state.t, S=vals({},t,'actual'), B=vals({},t,'budget'), m=MONTHS[t].label; const ql=q.toLowerCase();
  const park=PARKS.find(p=>ql.includes(p.l.toLowerCase().split(/[ ,(]/)[0].toLowerCase()) && p.k!=='oth');
  if(park){ const a=vals({park:park.k},t,'actual'), b=vals({park:park.k},t,'budget');
    return `<p><b>${park.l}</b> (${park.r}) in ${m}: ${chip('noi','Park NOI')} ${rs(a.noi,2)} cr against ${rs(b.noi,2)} cr budget, on ${rs(a.rev,2)} cr revenue.</p><p>${num(a.comp,2)}M sq ft finished, ${chip('occ')} ${num(a.occ*100,1)}%, ${chip('rent')} ${rs(a.rent,1)}, ${chip('real')} ${num(a.real*100,1)}%. ${a.np>0.05?`${num(a.np,2)}M sq ft is leased but not yet paying.`:''} ${a.lateA>0?`${num(a.lateA,2)}M sq ft is running ${num(a.daysLate,0)} days late, costing ${rs(a.rentLost,2)} cr of rent a month.`:''} Yield on cost ${num(a.yoc*100,1)}%.</p>`; }
  if(/bill|leak|owed/.test(ql)){ const rows=PARKS.map(p=>({p,a:vals({park:p.k},t,'actual')})).sort((x,y)=>(y.a.owed-y.a.rental)-(x.a.owed-x.a.rental)).slice(0,3);
    return `<p>In ${m} the leases said ${rs(S.owed,1)} cr of rent was owed and ${rs(S.rental,1)} cr was billed: ${rs(S.owed-S.rental,2)} cr not billed, ${chip('real')} ${num(S.real*100,1)}% against a 99.7% plan.</p><p>Largest gaps: ${rows.map(x=>`${x.p.l} ${rs(x.a.owed-x.a.rental,2)} cr (${num(x.a.real*100,1)}%)`).join(', ')}. Each point of rent billed is worth about ${rs(S.owed*.01,2)} cr a month.</p>`; }
  if(/not pay|lease-up|fit|waiting|lease faster|leased space/.test(ql)){ const rows=PARKS.map(p=>({p,a:vals({park:p.k},t,'actual')})).sort((x,y)=>y.a.np-x.a.np).slice(0,3);
    return `<p>${chip('np')} is ${num(S.np,2)}M sq ft against ${num(B.np,2)}M in the plan. At today’s rent that is ${rs(S.np*S.rent/10,2)} cr of rent a month waiting to start.</p><p>Most of it is at ${rows.map(x=>`${x.p.l} (${num(x.a.np,2)}M)`).join(', ')}: new blocks still in fit-out or rent-free.</p>`; }
  if(/cash|fcf|debt/.test(ql)){ return `<p>${chip('fcf')} was ${rs(S.fcf,1)} cr in ${m}. ${chip('cfo')} brought in ${rs(S.cfo,1)} cr; ${chip('capex')} used ${rs(S.capex,1)} cr and interest ${rs(S.fin,1)} cr.</p><p>${chip('dd')} are ${num(S.dd,0)} against ${num(B.dd,0)} planned, which held up about ${rs((S.dd-B.dd)/30*S.rev,1)} cr. ${chip('netDebt')} is ${rs(S.netDebt,0)} cr.</p>`; }
  if(/well|good|better|positive|last year|yoy|year ago/.test(ql) && t<12) return `<p>Last year’s figures start in April 2025, so pick a month from April 2026 to compare with last year.</p>`;
  if(/well|good|better|positive/.test(ql)){ const br=bridge({},t,'ly'); const ups=br?br.steps.filter(s=>s.v>0).sort((a,b)=>b.v-a.v).slice(0,3):[];
    return `<p>Against last year, revenue is up ${num((S.rev/(br?vals({},t-12,'actual').rev:S.rev)-1)*100,0)}%. The biggest contributors: ${ups.map(s=>`${s.l.toLowerCase()} +${rs(s.v,1)} cr`).join(', ')}.</p><p>EBITDA margin is ${num(S.margin*100,1)}%, and ${PARKS.filter(p=>vals({park:p.k},t,'actual').occ>.99).length} parks are fully let. Rent per sq ft is up ${num((S.rent/vals({},t-12,'actual').rent-1)*100,1)}% on a year ago, in line with contract escalations.</p>`; }
  if(/last year|yoy|year ago/.test(ql)){ const L=vals({},t-12,'actual'); return `<p>Against ${MONTHS[t-12].label}: ${chip('rev')} ${rs(S.rev,1)} cr vs ${rs(L.rev,1)} cr (+${num((S.rev/L.rev-1)*100,0)}%). ${chip('comp')} ${num(S.comp,1)}M vs ${num(L.comp,1)}M sq ft. ${chip('ebitda')} ${rs(S.ebitda,1)} cr vs ${rs(L.ebitda,1)} cr. ${chip('pat')} ${rs(S.pat,1)} cr vs ${rs(L.pat,1)} cr, mostly because interest fell after the IPO.</p>`; }
  if(/profit|break|turn/.test(ql)){ const X=vals({},t,'actual',{lag:.22,bill:.01,late:1}); return `<p>${chip('pat')} was ${rs(S.pat,1)} cr in ${m}, against ${rs(B.pat,1)} cr budget. It has been close to zero since the IPO cut interest; ${chip('icov')} is ${num(S.icov,2)}x.</p><p>The three systems in the board deck would have taken this month to about ${rs(X.pat,1)} cr: leasing faster, billing every rupee owed and finishing late blocks. Try it on the Scenarios page.</p>`; }
  if(/revenue|hurt|park|worst/.test(ql)){ const rows=PARKS.map(p=>({p,a:vals({park:p.k},t,'actual').rev,b:vals({park:p.k},t,'budget').rev})).sort((x,y)=>(x.a-x.b)-(y.a-y.b)).slice(0,4);
    return `<p>${chip('rev')} was ${rs(S.rev,1)} cr against ${rs(B.rev,1)} cr budget. The parks furthest behind: ${rows.map(x=>`${x.p.l} ${MINUS}${rs(x.b-x.a,2)} cr`).join(', ')}.</p><p>Oragadam, Dobbaspet I and Bilaspur are behind mainly on late blocks and space not yet paying; Farukhnagar I and Luhari on rent not billed and occupancy.</p>`; }
  if(/pat|budget|miss|ebitda|why/.test(ql)){ const br=bridge({},t,'budget'); const st=br.steps.slice().sort((a,b)=>a.v-b.v);
    return `<p>${chip('pat')} was ${rs(S.pat,1)} cr against ${rs(B.pat,1)} cr budget, ${MINUS}${rs(B.pat-S.pat,1)} cr. Almost all of it is ${chip('ebitda')}, ${MINUS}${rs(B.ebitda-S.ebitda,1)} cr.</p><p>The EBITDA gap by step: ${st.filter(s=>Math.abs(s.v)>.05).map(s=>`${s.l.toLowerCase()} ${s.v>=0?'+':MINUS}${num(Math.abs(s.v),2)}`).join(', ')}. Depreciation and interest together are ${rs((S.da+S.fin)-(B.da+B.fin),1)} cr over budget.</p>`; }
  if(/late|delay|construct|build/.test(ql)){ return `<p>${chip('lateA')} is ${num(S.lateA,2)}M sq ft, on average ${num(S.daysLate,0)} days behind. ${chip('rentLost')} ${rs(S.rentLost,2)} cr this month.</p>`; }
  if(/occup|vacan|empty/.test(ql)){ const w=PARKS.map(p=>({p,a:vals({park:p.k},t,'actual')})).sort((x,y)=>x.a.occ-y.a.occ).slice(0,3); return `<p>${chip('occ')} is ${num(S.occ*100,1)}% across ${num(S.comp,1)}M sq ft. Lowest: ${w.map(x=>`${x.p.l} ${num(x.a.occ*100,0)}%`).join(', ')}.</p>`; }
  return `<p>I can answer questions about the numbers in the tree: profit, revenue, rent, billing, occupancy, leased space not yet paying, late buildings, cash and debt, for the whole company or any park. Try one of the suggested questions.</p>`; }
function viewAsk(){ const m=MONTHS[state.t].label;
  return `<div class="ask"><div class="ph"><h2>Talk to data</h2><p>Answers come from the value tree. Every number has a source; click it to open that box.</p></div>
   ${state.convo.length?'':`<div style="color:var(--mute)">Try one of these questions about ${m}.</div><div class="qs">${QUESTIONS.map(q=>`<button data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`}
   <div class="convo">${state.convo.map(c=>`<div class="q-b">${esc(c.q)}</div><div class="a-b">${c.a}</div>`).join('')}</div>
   ${state.convo.length?`<div class="qs" style="margin-top:0">${QUESTIONS.filter(q=>!state.convo.find(c=>c.q===q)).slice(0,3).map(q=>`<button data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`:''}
   <form class="ask-bar" id="askF"><input id="askI" placeholder="Ask about the numbers, for example: why did PAT miss budget?" aria-label="Question"><button class="btn pri" type="submit">Ask</button></form></div>`; }
function bindAsk(){ const p=$('#page'); const go=q=>{ if(!q.trim()) return; state.convo.push({q,a:answer(q)}); renderPage(); const c=p.querySelectorAll('.a-b'); if(c.length) c[c.length-1].scrollIntoView({block:'center'}); };
  p.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>go(b.dataset.q)); $('#askF').onsubmit=e=>{ e.preventDefault(); go($('#askI').value); };
  p.querySelectorAll('[data-on]').forEach(c=>c.onclick=()=>{ state.L={format:null,region:null,park:null,seg:null}; openNode(c.dataset.on); }); }

// alerts page
const RULES=[['A1','Rent billed below 99% of rent owed','Share of rent billed, by park','Below 99% for the month','Head, Billing','Billing team, CFO'],['A2','Leased space not yet paying above plan','Leased, not yet paying','More than 10% above plan','Head, Leasing','Leasing team, CFO if above 25%'],['A3','Building running late against plan','Space running late, by park','Any block more than 30 days late','Head, Projects','Projects, CEO'],['A4','Park occupancy below 86%','Committed occupancy, by park','Below 86% for two months','Head, Leasing','Leasing team'],['A5','Debtor days above plan','Debtor days','More than 3 days above plan','Credit head','CFO'],['A6','Interest cover below 2.0x','EBITDA ÷ finance cost','Below 2.0x','Treasurer','CFO, Board audit committee']];
function viewAl(){ const all=alertsFor(state.t); const f=state.alertFilter; const list=all.filter(a=>f==='all'||(f==='open'&&a.status==='open')||(f==='esc'&&a.status==='esc')||(f==='ack'&&a.status==='ack')||(f==='closed'&&a.status==='closed'));
  const cnt=k=>all.filter(a=>a.status===k).length; if(!state.alertSel||!all.find(a=>a.id===state.alertSel)) state.alertSel=all[0]&&all[0].id; const sel=all.find(a=>a.id===state.alertSel);
  let h=`<div class="al-top"><div class="ph"><h2>Alerts</h2><p>${MONTHS[state.t].label} against budget. Six rules watch the tree and the engine checks them each time the numbers change.</p></div><div class="counts"><div><b class="bad-t">${cnt('open')}</b><span>Open</span></div><div><b style="color:var(--accent)">${cnt('esc')}</b><span>Escalated</span></div><div><b>${cnt('ack')}</b><span>Acknowledged</span></div><div><b class="good-t">${cnt('closed')}</b><span>Closed</span></div></div></div>
   <div class="subtabs"><button data-at="feed" class="${state.alertTab==='feed'?'on':''}">Feed and tracker</button><button data-at="rules" class="${state.alertTab==='rules'?'on':''}">Rules and limits</button></div>`;
  if(state.alertTab==='rules') return h+`<div class="box">${tableHTML(['Rule','Watches','Limit','Owner','Tells'],RULES.map(r=>[`<b>${r[0]}</b> ${r[1]}`,r[2],r[3],r[4],r[5]]))}<div class="deck-note">Limits are proposals to agree with Horizon’s finance team.</div></div>`;
  h+=`<div class="pill-f">${[['all','All'],['open','Open'],['esc','Escalated'],['ack','Acknowledged'],['closed','Closed']].map(([k,l])=>`<button data-af="${k}" class="${f===k?'on':''}">${l}</button>`).join('')}</div>
   <div class="al-grid"><div>${list.map(a=>`<div class="al-card ${a.id===state.alertSel?'on':''}" data-as="${a.id}" tabindex="0"><span class="dot ${a.status==='ack'?'amber':a.status==='closed'?'grey':''}"></span><div><div class="rule"><span class="tag" style="margin-right:8px">${a.id}</span>${esc(a.rule)}</div><div class="tt">${esc(a.title)}</div><div class="tags"><span style="color:var(--mute)">${esc(a.owner)}</span>${stTag(a)}</div></div>${impHTML(a)}</div>`).join('')||'<div class="empty">No alerts in this group.</div>'}</div>`;
  if(sel) h+=`<div class="al-detail" style="border-top-color:${sel.status==='closed'?'var(--good)':sel.status==='ack'?'var(--amber)':'var(--bad)'}"><div class="tags"><span class="tag">${sel.id}</span><b>${esc(sel.rule)}</b><span style="color:var(--mute)">${MONTHS[state.t].label}</span></div><h3>${esc(sel.title)}</h3><div class="tags">${stTag(sel)}<span style="color:var(--mute)">Owner: ${esc(sel.owner)}</span></div>
    <div class="sec">WHAT HAPPENED</div><div>${esc(sel.what)}</div><div class="sec">WHY</div><div style="color:var(--mute);font-size:13.5px">The drivers from the tree, largest gaps first. Click one to open it.</div>${sel.why.map(w=>`<div class="why-li" data-wn="${w.node}" data-wp="${w.park||''}"><div><b>${esc(w.l)}</b><span>${esc(w.dt)}</span></div><span style="color:var(--accent)">›</span></div>`).join('')}
    <div class="sec">SO WHAT</div><div class="sowhat">${esc(sel.so)}</div></div>`;
  return h+`</div>`; }
function bindAl(){ const p=$('#page'); p.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>{ state.alertTab=b.dataset.at; renderPage(); });
  p.querySelectorAll('[data-af]').forEach(b=>b.onclick=()=>{ state.alertFilter=b.dataset.af; renderPage(); });
  p.querySelectorAll('[data-as]').forEach(b=>{ b.onclick=()=>{ state.alertSel=b.dataset.as; renderPage(); }; b.onkeydown=e=>{ if(e.key==='Enter') b.click(); }; });
  p.querySelectorAll('[data-wn]').forEach(b=>b.onclick=()=>{ const pk=b.dataset.wp; state.L={format:null,region:pk?PARK_BY[pk].r:null,park:pk||null,seg:null}; renderFilters(); openNode(b.dataset.wn); }); }

// ---------- render ----------
function renderPage(){ const p=$('#page'); const v=state.view;
  if(v==='tree'){ p.innerHTML=viewTree(); bindTreeView(); }
  else if(v==='sc'){ p.innerHTML=viewSc(); bindSc(); }
  else if(v==='rp'){ p.innerHTML=viewRp(); bindRp(); }
  else if(v==='ask'){ p.innerHTML=viewAsk(); bindAsk(); }
  else { p.innerHTML=viewAl(); bindAl(); }
  p.querySelectorAll('.kpi[data-node]').forEach(k=>k.onclick=()=>openNode(k.dataset.node)); }
function renderAll(){ renderNav(); renderFilters(); renderPage(); }
$('#dClose').onclick=closeDrawer; $('#scrim').onclick=closeDrawer;
$('#modal').onclick=e=>{ if(e.target.id==='modal') $('#modal').classList.remove('on'); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDrawer(); $('#modal').classList.remove('on'); } });
$('#resetBtn').onclick=()=>{ Object.assign(state,{view:'tree',t:LAST_ACTUAL,cmp:'budget',L:{format:null,region:null,park:null,seg:null},tab:'pat',collapsed:{billed:true,ovh:true},zoom:{},treeSc:null,sc:{lag:0,bill:0,rent:0,occ:0,late:0,rate:0},preset:null,convo:[]}); closeDrawer(); renderAll(); };
let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(state.view==='tree') TABS[state.tab].trees.forEach(applyZoom); },120); });
renderAll();

</script>
</body>
